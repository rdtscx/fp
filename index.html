<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="color-scheme" content="light">
<title>浏览器参数</title>
<style>
:root{
  --bg:#f7f8fa;
  --panel:#ffffff;
  --panel2:#fbfcfd;
  --line:#e6e9ef;
  --line2:#eef1f5;
  --text:#1e2733;
  --muted:#5f6b7a;
  --dim:#8d97a5;
  --accent:#3f6fd8;
  --accent-soft:#eef3fd;
  --ok:#4b8f6b;
  --ok-bg:#f2f9f5;
  --ok-line:#d8ebdf;
  --na:#9aa3af;
  --na-bg:#f6f7f9;
  --na-line:#e4e7ec;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light;scroll-behavior:smooth}
body{
  margin:0;line-height:1.62;color:var(--text);background:var(--bg);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:#354356;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12px;line-height:1.4;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:#c9d3e2;color:#16202c;background:#fbfcfe}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#3562c4;border-color:#3562c4;color:#fff}
button.copy{background:transparent;border-color:var(--line);color:var(--dim);padding:1px 7px;font-size:10px;margin-left:8px;border-radius:6px}
button.copy:hover{color:var(--accent);border-color:#c7d7f2;background:#f7faff}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:190px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;display:grid;place-items:center;letter-spacing:.5px;border:1px solid #dbe6fa}
.brand strong{display:block;font-size:13.5px;font-weight:600;letter-spacing:.01em}
.brand small{display:block;color:var(--dim);font-size:10.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--panel);margin-left:auto}
.status .dot{width:6px;height:6px;border-radius:50%;background:#a6afba;flex-shrink:0}
.status.loading{color:#9a7b2f;border-color:#eee0c4;background:#fdf9ef}
.status.loading .dot{background:#cfa94a;animation:pulse 1s infinite}
.status.partial{color:#3c6bb5;border-color:#d7e2f5;background:#f5f9ff}
.status.partial .dot{background:#6d97d8;animation:pulse 1.2s infinite}
.status.done{color:#3f8060;border-color:#d9ebdf;background:#f4faf6}
.status.done .dot{background:#6aab84}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search .icon{position:absolute;left:10px;width:10px;height:10px;border:1.5px solid var(--dim);border-radius:50%;pointer-events:none}
.search .icon::after{content:"";position:absolute;width:5px;height:1.5px;background:var(--dim);transform:rotate(45deg);left:8px;top:9px}
.search input{font:inherit;font-size:12px;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 62px 7px 28px;outline:none;width:250px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:#a9b2bd}
.search input:focus{border-color:#b9cdf0;box-shadow:0 0 0 3px rgba(63,111,216,.08)}
.search #filter-count{position:absolute;right:9px;font-size:9.5px;color:var(--dim);pointer-events:none}
.progress{height:2px;background:transparent;overflow:hidden}
.progress.active{background:#eef1f6}
.progress span{display:block;height:100%;width:26%;background:linear-gradient(90deg,transparent,#c3d6f6,transparent);animation:slide 1.4s linear infinite}
.progress:not(.active) span{display:none}

.wrap{max-width:1320px;margin:0 auto;padding:20px 22px 56px}

/* hero */
.hero{border:1px solid var(--line);border-radius:14px;padding:24px 26px;background:var(--panel);margin-bottom:14px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:30px;align-items:start}
h1{font-size:clamp(21px,2.4vw,28px);margin:6px 0 8px;line-height:1.25;letter-spacing:-.01em;font-weight:650}
.hero-grid>div:first-child>.hero-meta{margin-top:2px}
.hero-meta{display:flex;flex-wrap:wrap;gap:7px;font-size:11px;color:var(--dim);align-items:center}
.hero-meta span{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);max-width:100%;word-break:break-word}
.live-pill{color:#3f8060!important;border-color:#d9ebdf!important;background:#f4faf6!important}
.fingerprint-card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:15px 16px}
.hash-row{padding:9px 0;border-top:1px dashed var(--line)}
.hash-row:first-child{border-top:0;padding-top:0}
.hash-label{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.hash-value{display:block;font-family:var(--mono);font-size:11.5px;color:#33507a;word-break:break-all;line-height:1.7;margin:5px 0 0;min-height:16px}
.hash-row .copy{margin-top:5px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-top:18px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
.stat b{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--dim);font-weight:600;text-transform:uppercase;margin-bottom:2px}
.stat span{font-size:12px;color:var(--text);word-break:break-word;display:block;line-height:1.5}
.stat-ip span{font-family:var(--mono);font-size:11.5px;color:#33507a}
.ip-detail{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:12px 14px}
.ip-detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ip-detail-title{font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.ip-detail-addr{font-family:var(--mono);font-size:13px;color:#33507a;word-break:break-all}
.ip-type,.ip-source{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#fff}
.ip-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:9px 20px;margin-top:11px}
.ip-detail-item{min-width:0;display:flex;flex-direction:column;gap:1px}
.ip-detail-item b{font-size:9.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;font-weight:600}
.ip-detail-item span{font-size:12px;color:#33404f;word-break:break-word;line-height:1.5}
.ip-detail-item span em.ip-zh{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:2px;font-family:inherit}
.ip-detail-item span em.ip-zh.na{color:var(--na)}
.ip-detail-item span.na{color:var(--na)}
button.ip-refresh{display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding:2px 9px;font-size:10.5px;line-height:1.6;border-radius:999px;color:var(--muted);background:#fff}
button.ip-refresh:hover{color:var(--accent);border-color:#c7d7f2;background:#f7faff}
button.ip-refresh svg{width:11px;height:11px;flex:none}
button.ip-refresh.busy{color:var(--dim);cursor:progress}
button.ip-refresh.busy svg{animation:spin 1.1s linear infinite}
.ip-map{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 9px 7px;min-width:0;max-width:560px;margin-top:10px}
.ip-map-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.ip-map-head b{font-size:9.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;font-weight:600}
.ip-map-continent{font-size:10.5px;color:#2f5db8;background:var(--accent-soft);border:1px solid #dbe6fa;border-radius:999px;padding:1px 8px;white-space:nowrap}
.ip-map svg{display:block;width:100%;height:auto}
.ip-map svg text{font-family:var(--mono);font-size:6.5px;fill:#9aa3af}
.ip-map .map-country{fill:#e3ebf4;stroke:#c2cfdf;stroke-width:.4;stroke-linejoin:round}
.ip-map .map-country.on{fill:#cdddf1}
.ip-map .map-city{fill:#e3ebf4;stroke:#c9d5e3;stroke-width:.5;stroke-linejoin:round}
.ip-map .map-city:hover{fill:#dbe7f5}
.ip-map .map-name{font-family:inherit;font-size:8.5px;fill:#5f6f83;paint-order:stroke;stroke:#f4f8fd;stroke-width:1.6px;stroke-linejoin:round;pointer-events:none}
.ip-map-empty{height:132px;display:grid;place-items:center;font-size:11px;color:var(--dim);background:var(--panel2);border:1px dashed var(--line);border-radius:6px;text-align:center;padding:0 10px}
.ip-map-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-size:10px;color:var(--dim);flex-wrap:wrap}
.ip-map-foot code{font-family:var(--mono);font-size:10px;color:#33507a}
.ip-map-key{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ip-map-key i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.ip-map-key i.tri,.ip-map-loc i{width:0;height:0;border-radius:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--ok);margin-left:6px}
.ip-map-key i.tri:first-child,.ip-map-loc i{margin-left:0}
.ip-map-loc{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10px;color:var(--muted)}
.ip-map-loc i.off{border-bottom-color:var(--na)}
.ip-map-addr{align-items:flex-start;color:#33404f}
.ip-map-addr b{flex:none;font-size:9.5px;letter-spacing:.06em;color:var(--dim);font-weight:600;line-height:1.9}
.ip-map-addr span{line-height:1.6;word-break:break-word}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.mini .chip{font-family:var(--mono);font-size:10px}
.skeleton{display:block;background:linear-gradient(90deg,#eef1f5,#f7f9fb,#eef1f5);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:5px}
.sk-line{height:12px;width:78%}
.sk-card{height:110px;margin-bottom:10px}
.sk-chip{height:16px;width:100px;display:inline-block}

/* nav */
.nav{display:flex;align-items:center;gap:10px;margin:12px 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.nav-links{display:flex;gap:3px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{white-space:nowrap;color:var(--muted);text-decoration:none;font-size:11.5px;padding:5px 9px;border-radius:7px;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.nav-links a:hover{background:#f3f6fb;color:var(--text)}
.nav-links a.active{background:var(--accent-soft);color:#2f5db8}
.nav-links b{font-weight:500;color:var(--dim);font-size:9px;background:#f5f7fa;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.nav-tools{display:flex;gap:4px;flex-shrink:0}
.nav-tools button{padding:4px 8px;font-size:10.5px;background:var(--panel2)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;margin:10px 0;overflow:hidden;scroll-margin-top:88px}
.card summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;list-style:none;user-select:none;transition:background .15s}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:var(--panel2)}
.sum-main{min-width:0;display:block}
.title{display:block;font-size:14px;font-weight:600;color:var(--text);letter-spacing:.005em}
.desc{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.55}
.sum-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.count{font-size:10px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin:0 5px}
.card[open] .chev{transform:rotate(-135deg)}
.pending-dot{width:7px;height:7px;border-radius:50%;background:#7aa6e0;box-shadow:0 0 0 3px rgba(63,111,216,.1);animation:pulse 1.2s infinite}
.sec-body{padding:0 18px 16px;border-top:1px solid var(--line2)}
.rows{padding-top:2px}

/* rows */
.row{display:grid;grid-template-columns:minmax(160px,240px) minmax(0,1fr);gap:20px;padding:9px 0;border-top:1px dashed var(--line2);align-items:start}
.row:first-child{border-top:0}
.row .k{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px}
.label{display:inline;font-size:12.5px;color:#33404f;word-break:break-word}
.src{display:inline;font-size:9px;font-family:var(--mono);color:var(--dim);word-break:break-word;line-height:1.45;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.vcell{min-width:0;font-size:12.5px;line-height:1.65}
.v{word-break:break-word;white-space:pre-wrap}
.v.na{color:var(--na)}
.v.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:4.9em}
.mono{font-family:var(--mono);font-size:11.5px}
.ratio{font-size:9.5px;color:var(--dim);margin-left:6px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:10.5px;color:#3b4a5c;word-break:break-word;max-width:100%}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:#41795b}
.chip.no{background:var(--na-bg);border-color:var(--na-line);color:var(--na)}
.fgrid{display:flex;flex-wrap:wrap;gap:5px}
.fgrid .chip b{font-weight:500}
.fgrid .chip i{font-style:normal;font-size:9px;color:#6f9a83;margin-left:4px;opacity:.9}
.fgrid .chip.no i{color:#a9b2bd}
.hint{display:block;font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5}
.hint::before{content:"用途 · ";color:#aeb7c2}
pre.json{margin:0;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:10.5px;color:#46586e;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.muted{color:var(--dim);font-size:11.5px}

/* states */
.loading-panel{color:var(--muted);font-size:12px;padding:16px;border:1px solid var(--line);border-radius:11px;background:var(--panel);margin:10px 0}
.loading-panel p{margin:8px 0 0}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:24px;border:1px dashed var(--line);border-radius:10px;margin:10px 0;background:var(--panel)}
#filter-empty{margin:14px 0}
footer{color:var(--dim);font-size:10.5px;margin-top:28px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:3px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:#fff;border:1px solid #cfdcef;color:#2c3a4c;padding:8px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:0 8px 24px rgba(31,45,66,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(430%)}}
@keyframes pulse{50%{opacity:.4}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:1500px){
  .topbar-inner,.wrap{max-width:1440px}
}
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr;gap:18px}
  .ip-map .map-name{font-size:10px}
}
@media (max-width:760px){
  .topbar-inner{padding:9px 12px;gap:8px}
  .brand{min-width:0}
  .brand small{display:none}
  .status{order:2;margin-left:auto;font-size:10px;padding:3px 8px}
  .actions{order:3;width:100%;gap:6px}
  .search{flex:1;min-width:0}
  .search input{width:100%;padding-right:56px}
  .actions button{padding:6px 8px;font-size:11px}
  .wrap{padding:14px 12px 44px}
  .hero{padding:18px 15px;border-radius:12px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .nav{flex-wrap:wrap;padding:7px 8px}
  .nav-tools{display:none}
  .card summary{padding:12px 14px}
  .sec-body{padding:0 14px 12px}
  .row{grid-template-columns:1fr;gap:3px;padding:8px 0}
  .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 130px)}
  .mini .chip{flex:1 1 100%;justify-content:space-between}
  .hash-value{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">FP</span>
      <div><strong>Browser Fingerprint</strong><small>真实参数报告</small></div>
    </div>
    <div class="status loading" id="status"><span class="dot"></span><span id="status-text">准备中</span></div>
    <div class="actions">
      <label class="search">
        <span class="icon"></span>
        <input id="q" type="search" placeholder="搜索参数或值" autocomplete="off" spellcheck="false">
        <span id="filter-count"></span>
      </label>
      <button id="btn-copy-all">复制 JSON</button>
      <button id="btn-download">下载</button>
      <button id="btn-reload" class="primary">重新采集</button>
    </div>
  </div>
  <div class="progress" id="progress"><span></span></div>
</header>

<main class="wrap">
  <nav class="nav" id="nav" hidden>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-tools">
      <button id="btn-expand">展开全部</button>
      <button id="btn-collapse">收起全部</button>
    </div>
  </nav>
  <section id="hero" class="hero"></section>
  <div id="sections"></div>
  <div id="filter-empty" class="empty" hidden>没有匹配的参数</div>
</main>

<div id="toast" class="toast"></div>
<noscript><p style="color:#f87171;padding:20px">本页需要启用 JavaScript 才能采集参数。</p></noscript>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeBool = (fn) => { try { return !!fn(); } catch (e) { return false; } };

const FONT_LIST = [
  'Arial','Arial Black','Arial Narrow','Arial Rounded MT Bold','Bahnschrift','Baskerville','Bookman Old Style',
  'Calibri','Cambria','Candara','Century Gothic','Comic Sans MS','Consolas','Constantia','Corbel','Courier New',
  'DejaVu Sans','DejaVu Sans Mono','DejaVu Serif','Didot','Franklin Gothic Medium','Futura','Garamond','Geneva',
  'Georgia','Gill Sans','Helvetica','Helvetica Neue','Impact','Liberation Mono','Liberation Sans','Liberation Serif',
  'Lucida Console','Lucida Grande','Lucida Sans Unicode','Menlo','Monaco','MS Gothic','MS PGothic','MS Sans Serif',
  'MS Serif','Nimbus Roman','Nimbus Sans','Optima','Palatino','Palatino Linotype','Roboto','Roboto Mono',
  'Segoe Print','Segoe Script','Segoe UI','Segoe UI Emoji','SF Pro Display','SF Pro Text','SF Mono','San Francisco',
  'Tahoma','Times','Times New Roman','Trebuchet MS','Ubuntu','Ubuntu Mono','Verdana','Webdings','Wingdings',
  'Cantarell','Noto Sans','Noto Serif','Noto Sans Mono','Fira Sans','Fira Code','Open Sans','Lato','Montserrat','Inter',
  'JetBrains Mono','Source Code Pro','Cascadia Code','Apple Color Emoji','Apple Symbols','Avenir','Avenir Next',

async function sha256(input) {
  try {
    const data = typeof input === 'string' ? new TextEncoder().encode(input) : input;
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return '';
  }
}

function plain(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number' && !Number.isFinite(v)) return String(v);
  if (typeof v === 'bigint') return String(v);
  if (ArrayBuffer.isView(v)) return Array.from(v).map(plain);
  if (v instanceof Set) return Array.from(v).map(plain);
  if (Array.isArray(v)) return v.map(plain);
  if (typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v)) o[k] = plain(v[k]);
    return o;
  }
  return v;
}

const SKIP_VALUE_RE = /^(不可用|读取失败|请求失败|查询中|不支持|未检测到|未能|未收集到|未提供|无数据|未知|（空|（未返回）)/;

function clean(v) {
  if (v === undefined || v === null) return undefined;
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s || SKIP_VALUE_RE.test(s)) return undefined;
    return v;
  }
  if (typeof v === 'number') return Number.isFinite(v) ? v : undefined;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'bigint') return String(v);
  if (ArrayBuffer.isView(v)) return clean(Array.from(v));
  if (v instanceof Set) return clean(Array.from(v));
  if (Array.isArray(v)) {
    const a = v.map(clean).filter((x) => x !== undefined);
    return a.length ? a : undefined;
  }
  if (typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v)) {
      const x = clean(v[k]);
      if (x !== undefined) o[k] = x;
    }
    return Object.keys(o).length ? o : undefined;
  }
  return v;
}

function featureHint(name) {
  if (FEATURE_HINTS[name]) return FEATURE_HINTS[name];
  if (/^Intl\./.test(name)) return '国际化';
  if (/WebGL|WebGPU|Canvas|Graphics/.test(name)) return '图形';
  if (/Audio|Media|Speech|Video|Codec/.test(name)) return '媒体';
  if (/Storage|Cache|IndexedDB|File/.test(name)) return '存储';
  if (/Bluetooth|USB|Serial|HID|NFC/.test(name)) return '设备接口';
  if (/Sensor|Gyroscope|Accelerometer|Magnetometer|Orientation|Motion/.test(name)) return '传感器';
  if (/Payment|Credential|Auth|FedCM|Identity/.test(name)) return '认证支付';
  if (/Worker|Locks|Broadcast|Message/.test(name)) return '并发通信';
  if (/Permission|Notification|Privacy|Aggregation/.test(name)) return '隐私权限';
  return '浏览器能力';
}

function mediaHint(name) {
  if (/prefers-color-scheme/.test(name)) return '深色模式';
  if (/prefers-reduced-motion/.test(name)) return '减少动画';

function cssHint(name) {

function add(secId, label, value, source, opts) {
  const st = STATE.get(secId);
  if (!st) return null;
  const o = opts || {};
  let v;
  let total;
  let supported;
  let na = false;
  let rawText = null;
  if (o.type === 'features') {
    const arr = Array.isArray(value) ? value : [];
    const items = arr.filter(Boolean).map((x) => ({
      ...x,
      ok: x.ok === true,
      hint: o.hint || (secId === 'css' ? cssHint(x.name) : secId === 'screen' ? mediaHint(x.name) : featureHint(x.name))
    }));
    if (!items.length) return null;
    v = items;
    total = arr.length;
    supported = items.filter((x) => x.ok).length;
  } else {
    v = clean(value);
    if (v === undefined) {
      na = true;
      if (typeof value === 'string' && value.trim()) rawText = value.trim();
    }
  }
  const row = { label, value: v, source, ...o, total, supported, na, rawText, hint: o.hint || hintFor(secId, label) };
  st.rows.push(row);
  scheduleRender();
  return row;
}

let renderTimer = 0;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = 0; render(); }, 120);
}

function fmtValue(v, row) {
  if (row && row.type === 'features') {
    const items = Array.isArray(v) ? v : [];
    return `<div class="fgrid">${items.map((it) => `<span class="chip ${it.ok ? 'ok' : 'no'}" title="${esc(it.expr || it.name)}${it.hint ? ' · ' + it.hint : ''}"><b>${esc(it.name)}</b>${it.hint ? `<i>${esc(it.hint)}</i>` : ''}</span>`).join('')}</div>`;
  }
  if (v === null || v === undefined) {
    return `<span class="v na">${esc((row && row.rawText) || '不可用')}</span>`;
  }
  if (ArrayBuffer.isView(v)) v = Array.from(v);
  if (Array.isArray(v)) {
    const simple = v.every((x) => x === null || typeof x !== 'object');
    if (simple) return `<div class="chips">${v.map((x) => `<span class="chip">${esc(x === null ? 'null' : String(x))}</span>`).join('')}</div>`;
    return `<pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`;
  }
  if (v && typeof v === 'object') return `<pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`;
  const text = String(v);
  const mono = (row && (row.mono || row.copy)) || /^[0-9a-f]{32,}$/i.test(text);
  const long = text.length > 120;
  const copy = row && row.copy ? `<button class="copy" data-copy="${esc(text)}">复制</button>` : '';
  const expand = long ? '<button class="copy" data-expand="1">展开</button>' : '';
  return `<span class="v${mono ? ' mono' : ''}${long ? ' clamp' : ''}">${esc(text)}</span>${expand}${copy}`;
}

function renderRow(r) {
  const live = r.liveKey ? ` data-live="${esc(r.liveKey)}"` : '';
  const naCls = r.na ? ' na' : '';
  if (r.type === 'features') {
    const ratio = r.total ? `<span class="ratio">${r.supported}/${r.total}</span>` : '';
    return `<div class="row${naCls}"${live}><div class="k"><span class="label">${esc(r.label)}</span>${ratio}<span class="src">${esc(r.source)}</span></div><div class="vcell">${fmtValue(r.value, r)}</div></div>`;
  }
  const hint = r.hint ? `<div class="hint">${esc(r.hint)}</div>` : '';
  return `<div class="row${naCls}"${live}><div class="k"><span class="label">${esc(r.label)}</span><span class="src">${esc(r.source)}</span></div><div class="vcell">${fmtValue(r.value, r)}${hint}</div></div>`;
}

function totalRows() {
  return SEC_DEFS.reduce((n, d) => n + (STATE.get(d.id).rows.length || 0), 0);
}

function visibleDefs() {
  return SEC_DEFS.filter((d) => STATE.get(d.id).rows.length > 0);

function formatDuration(ms) {
  if (ms === null || ms === undefined || !Number.isFinite(ms)) return '—';
  return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s';
}

function carrierFromAsn(asn) {
  const n = Number(String(asn === null || asn === undefined ? '' : asn).replace(/^AS/i, ''));
  return Number.isFinite(n) ? (CN_ASN_CARRIERS[n] || null) : null;
}

function carrierFromText(text) {
  const t = String(text || '');
  if (!t) return null;
  const hit = CN_CARRIERS.find(([re]) => re.test(t));
  if (hit) return hit[1];
  if (/chinanet|chinatelecom|china\s*telecom|\bctc\b/i.test(t)) return '电信';
  if (/china\s*unicom|chinaunicom|\bcucc\b|\bcncgroup\b|\bchina169\b/i.test(t)) return '联通';
  if (/chinamobile|china\s*mobile|\bcmcc\b|\bcmnet\b/i.test(t)) return '移动';
  if (/broadnet|broadcast|radio\s*&?\s*tv|\bcbn\b|catv/i.test(t)) return '广电';
  return null;
}

// 优先取与权威运营商一致的字段；都不一致时用规范英文名，避免展示错误的 ISP 文案
function pickIsp(geo) {
  const list = [geo.isp, geo.org].filter((s) => typeof s === 'string' && s.trim());
  const branded = list.filter((s) => carrierFromText(s));
  if (geo.carrier) {
    const exact = branded.find((s) => carrierFromText(s) === geo.carrier.zh);
    if (exact) return exact;
    if (geo.carrier.en) return geo.carrier.en;
  }
  return branded[0] || geo.org || geo.isp || null;
}

function ispZhName(raw, geo, countryName) {
  const g = geo || {};
  const cc = String(g.country_code || '').toUpperCase();
  const text = String(raw || '');
  const carrierInfo = g.carrier || null;
  if (!carrierInfo && !text) return null;
  if (!carrierInfo && /[\u4e00-\u9fa5]/.test(text)) return text;
  let carrier = carrierInfo ? carrierInfo.zh : carrierFromText(text);
  if (!carrier && cc === 'CN') carrier = carrierFromText(g.org) || carrierFromText(g.isp);
  if (carrier) {
    const where = text + ' ' + (g.region || '') + ' ' + (carrierInfo && carrierInfo.holder ? carrierInfo.holder : '');
    const prov = CN_PROVINCES.find(([en]) => new RegExp('\\b' + en + '\\b', 'i').test(where));
    if (prov) return prov[1] + carrier;
    return '中国' + carrier + (cc === 'CN' ? '' : '（海外）');
  }
  const brand = FOREIGN_ISPS.find(([re]) => re.test(text));
  if (brand) {
    const b = brand[1];
    if (!countryName || b.startsWith(countryName)) return b;
    return `${countryName} ${b}`;
  }
  return null;
}

      <div class="sec-body"><div class="rows">${st.rows.map(renderRow).join('')}</div></div>
    </details>`;
  }).join('');
  bindDetails();
}

function bindDetails() {
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    d.addEventListener('toggle', () => {
      if (UI.suppressToggle || UI.query) return;
      if (d.open) UI.open.add(d.dataset.sec);
      else UI.open.delete(d.dataset.sec);
    });
  });
}

function applyFilter() {
  const input = $('#q');
  const q = (input ? input.value : '').trim().toLowerCase();
  UI.query = q;
  let matches = 0;
  UI.suppressToggle = true;
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    let sectionMatches = 0;
    d.querySelectorAll('.row').forEach((row) => {
      const hit = !q || row.innerText.toLowerCase().includes(q);
      row.hidden = !hit;
      if (hit) sectionMatches++;
    });
    d.hidden = q ? sectionMatches === 0 : false;
    if (q && sectionMatches) d.open = true;
    if (!q) d.open = UI.open.has(d.dataset.sec);
    matches += sectionMatches;
    const nav = document.querySelector('#nav-links a[data-nav="' + d.dataset.sec + '"]');
    if (nav) nav.hidden = d.hidden;
  });
  UI.suppressToggle = false;
  const fc = $('#filter-count');
  if (fc) fc.textContent = q ? `${matches} 项匹配` : '';
  const empty = $('#filter-empty');
  if (empty) empty.hidden = !(q && matches === 0);
}

function updateActiveNav() {
  const links = Array.from(document.querySelectorAll('#nav-links a[data-nav]')).filter((a) => !a.hidden);
  if (!links.length) return;
  const y = window.scrollY + 140;
  let active = links[0];
  for (const a of links) {
    const el = document.getElementById('sec-' + a.dataset.nav);
    if (el && el.getBoundingClientRect().top + window.scrollY <= y) active = a;
  }
  links.forEach((a) => a.classList.toggle('active', a === active));
}

function render() {
  renderStatus();
  renderHero();
  renderNav();
  renderSections();
  applyFilter();
  updateActiveNav();
}

const LIVE = new Map();
let liveScrollRaf = 0;

function liveRow(secId, key, label, source, fn, opts) {
  const row = add(secId, label, fn(), source, opts);
  if (row) {
    row.liveKey = key;
    LIVE.set(key, { row, fn, secId });
  }
  return row;
}

function refreshLiveDom() {
  for (const [key, entry] of LIVE.entries()) {
    const { row, fn, secId } = entry;
    let raw;
    let next;
    try {
      raw = fn();
      next = clean(raw);
    } catch (e) {
      raw = undefined;
      next = undefined;
    }
    if (row.type === 'features') {
      const items = (Array.isArray(next) ? next : []).filter(Boolean).map((x) => ({
        ...x,
        ok: x.ok === true,
        hint: x.hint || (secId === 'css' ? cssHint(x.name) : secId === 'screen' ? mediaHint(x.name) : featureHint(x.name))
      }));
      if (JSON.stringify(items) === JSON.stringify(row.value)) continue;
      row.value = items;
      row.supported = items.filter((x) => x.ok).length;
    } else if (next === undefined) {
      const msg = (typeof raw === 'string' && raw.trim()) ? raw.trim() : null;
      if (row.na && row.rawText === msg) continue;
      row.value = null;
      row.na = true;
      row.rawText = msg;
    } else {
      if (!row.na && JSON.stringify(next) === JSON.stringify(row.value)) continue;
      row.value = next;
      row.na = false;
      row.rawText = null;
    }
    const el = document.querySelector('[data-live="' + key + '"]');
    if (el) {
      const tpl = document.createElement('div');
      tpl.innerHTML = renderRow(row);
      const fresh = tpl.firstElementChild;
      if (fresh) el.replaceWith(fresh);
    }
  }
}

function startLiveRefresh() {
  refreshLiveDom();
  setInterval(() => {
    if (!document.hidden) refreshLiveDom();
  }, 1000);
  setInterval(() => {
    if (!document.hidden && navigator.onLine) refreshPublicIP();
  }, 90000);
  window.addEventListener('resize', refreshLiveDom, { passive: true });
  window.addEventListener('orientationchange', refreshLiveDom);
  window.addEventListener('online', () => { refreshLiveDom(); refreshPublicIP(); });
  window.addEventListener('offline', refreshLiveDom);
  window.addEventListener('focus', refreshLiveDom);
  window.addEventListener('blur', refreshLiveDom);
  document.addEventListener('visibilitychange', refreshLiveDom);
  window.addEventListener('scroll', () => {
    if (liveScrollRaf) return;
    liveScrollRaf = requestAnimationFrame(() => { liveScrollRaf = 0; refreshLiveDom(); });
  }, { passive: true });
}

function buildReport() {
  return {
    schema: 'browser-fingerprint-report/2',
    meta: {
      version: 2,
      generatedAt: META.generatedAt,
      pageUrl: META.pageUrl,
      referrer: META.referrer,
      userAgent: META.userAgent || navigator.userAgent,
      durationMs: META.durationMs,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      languages: navigator.languages
    },
    summary: plain(SUMMARY),
    sections: SEC_DEFS.map((def) => {
      const st = STATE.get(def.id);
      return {
        id: def.id,
        title: def.title,
        description: def.desc,
        done: st.done,
        rows: st.rows.map((r) => ({
          label: r.label,
          value: plain(r.value),
          source: r.source,
          type: r.type || 'value',
          total: r.total,
          supported: r.supported,
          copy: r.copy || undefined,
          hint: r.hint || undefined
        }))
      };
    })
  };
}

function showToast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制到剪贴板');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本');
  }
}

async function copyAll() {
  await copyText(JSON.stringify(buildReport(), null, 2));
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(buildReport(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = `browser-fingerprint-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  showToast('已生成 JSON 文件');
}

function forceRefresh() {

}

function expandAll() {
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {

  const btn = e.target.closest('button');
  if (btn) {
    if (btn.id === 'btn-copy-all') { copyAll(); return; }
    if (btn.id === 'btn-download') { downloadJSON(); return; }
    if (btn.id === 'btn-reload') { forceRefresh(); return; }
    if (btn.id === 'btn-ip-refresh') { refreshPublicIP({ manual: true }); return; }
    if (btn.id === 'btn-expand') { expandAll(); return; }
    if (btn.id === 'btn-collapse') { collapseAll(); return; }
    if (btn.dataset.expand !== undefined) {

function parseBrowserTokens(ua) {
  const list = [];
  const push = (name, version) => { if (version) list.push({ name, version }); };
  let m;
  if ((m = ua.match(/\bEdg(?:A|iOS)?\/([\d.]+)/))) push('Microsoft Edge', m[1]);
  if ((m = ua.match(/\bEdge\/([\d.]+)/))) push('Microsoft Edge (Legacy)', m[1]);
  if ((m = ua.match(/\b(?:OPR|OPiOS)\/([\d.]+)/))) push('Opera', m[1]);
  if ((m = ua.match(/\bSamsungBrowser\/([\d.]+)/))) push('Samsung Internet', m[1]);
  if ((m = ua.match(/\bUCBrowser\/([\d.]+)/))) push('UC Browser', m[1]);
  if ((m = ua.match(/\bQQBrowser\/([\d.]+)/))) push('QQ Browser', m[1]);
  if ((m = ua.match(/\bQuark\/([\d.]+)/))) push('Quark', m[1]);
  if ((m = ua.match(/\bMiuiBrowser\/([\d.]+)/))) push('Miui Browser', m[1]);
  if ((m = ua.match(/\bHuaweiBrowser\/([\d.]+)/))) push('Huawei Browser', m[1]);
  if ((m = ua.match(/\bVivaldi\/([\d.]+)/))) push('Vivaldi', m[1]);
  if ((m = ua.match(/\bBrave\/([\d.]+)/))) push('Brave', m[1]);
  if ((m = ua.match(/\bElectron\/([\d.]+)/))) push('Electron', m[1]);
  if ((m = ua.match(/\bArkWeb\/([\d.]+)/))) push('ArkWeb', m[1]);
  if ((m = ua.match(/\bMicroMessenger\/([\d.]+)/))) push('微信内置浏览器', m[1]);
  if ((m = ua.match(/\bQQ\/([\d.]+)/))) push('QQ 内置浏览器', m[1]);
  if ((m = ua.match(/\bWeibo\/([\d.]+)/))) push('微博内置浏览器', m[1]);
  if ((m = ua.match(/\baweme\/([\d.]+)/i))) push('抖音内置浏览器', m[1]);
  if ((m = ua.match(/\bAlipayClient\/([\d.]+)/))) push('支付宝内置浏览器', m[1]);
  if ((m = ua.match(/\b(?:baidubrowser|baiduboxapp)[\/ ]?([\d.]*)/i))) push('百度', m[1] || '');
  if ((m = ua.match(/\b(?:Firefox|FxiOS)\/([\d.]+)/))) push('Firefox', m[1]);
  if ((m = ua.match(/\b(?:Chrome|CriOS|CrMo)\/([\d.]+)/))) push('Chrome', m[1]);
  else if ((m = ua.match(/\bChromium\/([\d.]+)/))) push('Chromium', m[1]);
  const safariGuard = !/Chrome|Chromium|CriOS|Edg\/|OPR\/|OPiOS|UCBrowser|Quark|SamsungBrowser|MiuiBrowser|HuaweiBrowser|MicroMessenger|QQBrowser|baidubrowser|baiduboxapp/i.test(ua);
  if (safariGuard && (m = ua.match(/\bVersion\/([\d.]+).*Safari\//))) push('Safari', m[1]);
  return list;
}

function pickBrowser(tokens, hints) {
  if (hints && Array.isArray(hints.fullVersionList)) {
    const brands = hints.fullVersionList.filter((b) => !/not[.\s]?a[\/ ]?brand/i.test(b.brand));
    const order = ['Microsoft Edge', 'Opera', 'Brave', 'Google Chrome', 'Chromium'];
    for (const name of order) {
      const b = brands.find((x) => x.brand === name);
      if (b) return `${name === 'Google Chrome' ? 'Chrome' : name} ${b.version}`;
    }
  }
  const priority = ['Microsoft Edge', 'Microsoft Edge (Legacy)', 'Opera', 'Samsung Internet', 'UC Browser', 'QQ Browser', 'Quark', 'Miui Browser', 'Huawei Browser', 'Brave', 'Vivaldi', 'Firefox', 'Chrome', 'Chromium', 'Safari'];
  for (const name of priority) {
    const t = tokens.find((x) => x.name === name);
    if (t) return `${name} ${t.version}`;
  }
  return tokens.length ? `${tokens[0].name} ${tokens[0].version}`.trim() : '未识别';
}

function detectEngine(ua, maxTouch, hints) {
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && maxTouch > 1);
  const appleWebKit = ua.match(/AppleWebKit\/([\d.]+)/);
  const firefox = ua.match(/\bFirefox\/([\d.]+)/);
  const chromiumFull = (hints && hints.uaFullVersion)
    || (hints && Array.isArray(hints.fullVersionList) ? ((hints.fullVersionList.find((b) => b.brand === 'Google Chrome' || b.brand === 'Chromium') || {}).version || null) : null);
  const chromiumUA = ua.match(/\b(?:Chrome|Chromium|CriOS)\/([\d.]+)/);

  if (/Trident\/|MSIE /.test(ua)) {
    const v = ua.match(/Trident\/([\d.]+)/);
    return { name: 'Trident', version: v ? v[1] : '', detail: `Trident ${v ? v[1] : '（版本未知）'}（IE 内核）`, short: `Trident ${v ? v[1] : ''}`.trim(), basis: '解析 · UA 含 Trident/MSIE 标记' };
  }
  if (/\bEdge\//.test(ua) && !/\bEdg\//.test(ua)) {
    const v = ua.match(/\bEdge\/([\d.]+)/);
    return { name: 'EdgeHTML', version: v[1], detail: `EdgeHTML ${v[1]}（旧版 Edge）`, short: `EdgeHTML ${v[1]}`, basis: '解析 · UA 含 Edge/ 标记' };
  }
  if (isIOS) {
    const v = appleWebKit ? appleWebKit[1] : '';
    return { name: 'WebKit', version: v, detail: `WebKit（AppleWebKit ${v || '版本未知'}）`, short: `WebKit ${v}`.trim(), basis: '推断 · iOS/iPadOS 上浏览器受系统限制使用 WebKit（依据平台）' };
  }
  if (firefox) {
    return { name: 'Gecko', version: firefox[1], detail: `Gecko ${firefox[1]}（Firefox 内核）`, short: `Gecko ${firefox[1]}`, basis: '解析 · UA 含 Firefox 与 Gecko 标记' };
  }
  if (chromiumFull || chromiumUA) {
    const v = chromiumFull || chromiumUA[1];
    const reduced = /\.0\.0\.0$/.test(chromiumUA ? chromiumUA[1] : '');
    return {
      name: 'Blink', version: v,
      detail: `Blink（Chromium ${v}）`,
      short: `Blink / Chromium ${v}`,
      basis: chromiumFull ? 'UA-CH 高熵值（精确版本）' : `解析 · UA Chrome token（${reduced ? '版本号被浏览器简化' : '完整版本'}）`
    };
  }
  if (/\bEdg\//.test(ua) || /\bOPR\//.test(ua)) {
    const v = (chromiumUA && chromiumUA[1]) || '';
    return { name: 'Blink', version: v, detail: `Blink（Chromium ${v || '版本未知'}）`, short: `Blink / Chromium ${v}`.trim(), basis: '解析 · UA 品牌标记' };
  }
  if (appleWebKit) {
    const v = appleWebKit[1];
    return { name: 'WebKit', version: v, detail: `WebKit（AppleWebKit ${v}）`, short: `WebKit ${v}`, basis: '解析 · UA 含 AppleWebKit 且无 Chrome/Firefox 标记' };
  }
  return { name: '未知', version: '', detail: '未能从 UA 判定渲染引擎', short: '未知', basis: '解析 · 无匹配令牌' };
}

function parseOS(ua, maxTouch) {
  const touch = (typeof maxTouch === 'number') ? maxTouch : navigator.maxTouchPoints;
  let m;
  if ((m = ua.match(/HarmonyOS[\/ ]?([\d.]+)?/i))) {
    return { display: `HarmonyOS ${m[1] || '（版本未提供）'}`, short: 'HarmonyOS', basis: '解析 · UA 含 HarmonyOS 标记' };
  }
  if (/OpenHarmony/.test(ua)) {
    return { display: 'OpenHarmony', short: 'OpenHarmony', basis: '解析 · UA 含 OpenHarmony 标记' };
  }
  if ((m = ua.match(/Windows NT ([\d.]+)/))) {
    const map = {
      '10.0': 'Windows 10 / 11（UA 均为 NT 10.0，无法区分）',
      '6.3': 'Windows 8.1', '6.2': 'Windows 8', '6.1': 'Windows 7',
      '6.0': 'Windows Vista', '5.1': 'Windows XP'
    };
    return { display: map[m[1]] || `Windows NT ${m[1]}`, short: 'Windows', basis: '解析 · UA 的 Windows NT 版本令牌' };
  }
  if ((m = ua.match(/Android\s?([\d.]+)/))) {
    return { display: `Android ${m[1]}`, short: `Android ${m[1]}`, basis: '解析 · UA 含 Android 版本' };
  }
  if ((m = ua.match(/(?:iPhone|iPad|iPod).*?OS (\d+)[._](\d+)(?:[._](\d+))?/))) {
    const v = [m[1], m[2], m[3]].filter(Boolean).join('.');
    return { display: `iOS / iPadOS ${v}`, short: `iOS ${v}`, basis: '解析 · UA 含 iPhone/iPad OS 版本' };
  }
  if (/Macintosh/.test(ua) && touch > 1) {
    return { display: 'iPadOS（桌面站点模式 UA 伪装为 Macintosh，依据触点数推断）', short: 'iPadOS', basis: '推断 · Macintosh UA + maxTouchPoints > 1' };
  }
  if ((m = ua.match(/Mac OS X (\d+)[._](\d+)(?:[._](\d+))?/))) {
    const v = [m[1], m[2], m[3]].filter(Boolean).join('.');
    return { display: `macOS ${v}`, short: `macOS ${v}`, basis: '解析 · UA 含 Mac OS X 版本' };
  }
  if ((m = ua.match(/CrOS \S+ ([\d.]+)/))) {
    return { display: `ChromeOS ${m[1]}`, short: 'ChromeOS', basis: '解析 · UA 含 CrOS 标记' };
  }
  if (/Ubuntu/.test(ua)) return { display: 'Ubuntu Linux', short: 'Ubuntu', basis: '解析 · UA 含 Ubuntu 标记' };
  if (/Linux/.test(ua)) return { display: 'Linux', short: 'Linux', basis: '解析 · UA 含 Linux 标记' };
  return { display: '未能从 UA 判定', short: '未知', basis: '解析 · 无匹配令牌' };
}

async function collectBrowser() {
  const ua = navigator.userAgent;
  META.userAgent = ua;
  add('browser', 'User-Agent', ua, 'navigator.userAgent');
  add('browser', 'UA 字符串长度', ua.length, '实测');
  add('browser', 'appName', navigator.appName, 'navigator.appName');
  add('browser', 'appVersion', navigator.appVersion, 'navigator.appVersion');
  add('browser', 'appCodeName', navigator.appCodeName, 'navigator.appCodeName');
  add('browser', 'product', navigator.product, 'navigator.product');
  add('browser', 'productSub', navigator.productSub, 'navigator.productSub');
  add('browser', 'vendor', navigator.vendor, 'navigator.vendor');
  add('browser', 'vendorSub', navigator.vendorSub, 'navigator.vendorSub');
  add('browser', 'platform（旧字段）', navigator.platform, 'navigator.platform');
  add('browser', 'pdfViewerEnabled', navigator.pdfViewerEnabled === undefined ? '不可用' : navigator.pdfViewerEnabled, 'navigator.pdfViewerEnabled');
  add('browser', 'webdriver', navigator.webdriver, 'navigator.webdriver');

  const uad = navigator.userAgentData;
  if (!uad) {
    add('browser', 'User-Agent Client Hints', '不可用', 'navigator.userAgentData 不存在');
  } else {
    add('browser', 'UA-CH 品牌（brands）', (uad.brands || []).map((b) => `${b.brand} ${b.version}`), 'navigator.userAgentData.brands');
    add('browser', 'UA-CH mobile', uad.mobile, 'navigator.userAgentData.mobile');
    add('browser', 'UA-CH platform', uad.platform, 'navigator.userAgentData.platform');
    try {
      uaHigh = await uad.getHighEntropyValues([
        'architecture', 'bitness', 'model', 'platformVersion',
        'uaFullVersion', 'fullVersionList', 'wow64', 'formFactors'
      ]);
      add('browser', 'UA-CH fullVersionList', (uaHigh.fullVersionList || []).map((b) => `${b.brand} ${b.version}`), 'getHighEntropyValues(["fullVersionList"])');
      add('browser', 'UA-CH uaFullVersion', uaHigh.uaFullVersion || '不可用', 'getHighEntropyValues(["uaFullVersion"])');
    } catch (e) {
      add('browser', 'UA-CH 高熵值', '读取失败：' + (e.name || 'Error'), 'getHighEntropyValues() 异常');
    }
  }

  const tokens = parseBrowserTokens(ua);
  add('browser', 'UA 中识别到的浏览器/应用', tokens.length ? tokens.map((t) => `${t.name} ${t.version}`.trim()) : ['未识别'], '解析 · userAgent');

  const engine = detectEngine(ua, navigator.maxTouchPoints, uaHigh);
  add('browser', '渲染引擎', engine.detail, engine.basis);
  add('browser', '内核版本', engine.version || '未能单独判定', engine.basis);
  add('browser', '浏览器品牌/版本', pickBrowser(tokens, uaHigh), '综合 UA-CH 与 UA 解析');

  const wv = [];
  if (/;\s*wv\)/.test(ua)) wv.push('UA 含 "; wv)"');
  if (/Android/.test(ua) && /Version\/4\.0/.test(ua)) wv.push('Android + Version/4.0');
  if (/\bwv\b/.test(ua)) wv.push('UA 含 wv 标记');
  if (wv.length) add('browser', 'Android WebView 判定', { likely: true, signals: wv }, '推断 · UA 信号组合');

  const apps = [];
  const appPatterns = [
    ['微信', /MicroMessenger\/([\d.]+)/], ['QQ', /\bQQ\/([\d.]+)/], ['QQ 浏览器', /QQBrowser\/([\d.]+)/],
    ['微博', /Weibo\/([\d.]+)/], ['抖音', /aweme\/([\d.]+)/i], ['支付宝', /AlipayClient\/([\d.]+)/],
    ['百度', /(baidubrowser|baiduboxapp)[\/ ]?([\d.]*)/i], ['UC', /UCBrowser\/([\d.]+)/],
    ['夸克', /Quark\/([\d.]+)/], ['小米浏览器', /MiuiBrowser\/([\d.]+)/], ['华为浏览器', /HuaweiBrowser\/([\d.]+)/],
    ['三星浏览器', /SamsungBrowser\/([\d.]+)/], ['vivo 浏览器', /VivoBrowser\/([\d.]+)/],

function measureUnit(prop, value) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;left:-10000px;top:0;visibility:hidden;${prop}:${value};`;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.remove();
  return prop === 'width' ? r.width : r.height;
}

function tryGL(type) {
  try {
    const c = document.createElement('canvas');
    return c.getContext(type);
  } catch (e) {
    return null;
  }
}

async function collectGraphics() {
  const g2 = tryGL('webgl2');
  const g1 = tryGL('webgl') || tryGL('experimental-webgl');
  const gl = g2 || g1;
  if (!gl) return;
  add('graphics', 'WebGL 上下文', g2 ? 'WebGL2' : 'WebGL1', "canvas.getContext('webgl2' / 'webgl')");
  add('graphics', '使用的上下文', (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) ? 'WebGL2RenderingContext' : 'WebGLRenderingContext', 'instanceof 检测');

  const maskedVendor = gl.getParameter(gl.VENDOR);
  const maskedRenderer = gl.getParameter(gl.RENDERER);
  add('graphics', 'VENDOR（屏蔽）', maskedVendor, 'gl.getParameter(gl.VENDOR)');
  add('graphics', 'RENDERER（屏蔽）', maskedRenderer, 'gl.getParameter(gl.RENDERER)');
  add('graphics', 'VERSION', gl.getParameter(gl.VERSION), 'gl.getParameter(gl.VERSION)');
  add('graphics', 'SHADING_LANGUAGE_VERSION', gl.getParameter(gl.SHADING_LANGUAGE_VERSION), 'gl.getParameter(gl.SHADING_LANGUAGE_VERSION)');

  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  let unmaskedVendor = null;
  let unmaskedRenderer = null;
  SUMMARY.gpu = maskedRenderer || '—';
  if (dbg) {
    unmaskedVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
    unmaskedRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    SUMMARY.gpu = unmaskedRenderer || maskedRenderer || '—';
    add('graphics', 'UNMASKED_VENDOR_WEBGL', unmaskedVendor, 'WEBGL_debug_renderer_info');
    add('graphics', 'UNMASKED_RENDERER_WEBGL', unmaskedRenderer, 'WEBGL_debug_renderer_info');
  } else {
    add('graphics', 'WEBGL_debug_renderer_info', '不可用（扩展不存在，浏览器已屏蔽真实渲染器）', 'gl.getExtension');
  }

  const attrs = gl.getContextAttributes();
  if (attrs) add('graphics', '上下文属性', attrs, 'gl.getContextAttributes()');

  const paramNames = [
    'MAX_TEXTURE_SIZE', 'MAX_CUBE_MAP_TEXTURE_SIZE', 'MAX_RENDERBUFFER_SIZE', 'MAX_VIEWPORT_DIMS',
    'ALIASED_LINE_WIDTH_RANGE', 'ALIASED_POINT_SIZE_RANGE', 'MAX_VERTEX_ATTRIBS',
    'MAX_VERTEX_UNIFORM_VECTORS', 'MAX_FRAGMENT_UNIFORM_VECTORS', 'MAX_VARYING_VECTORS',
    'MAX_COMBINED_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_TEXTURE_IMAGE_UNITS',
    'RED_BITS', 'GREEN_BITS', 'BLUE_BITS', 'ALPHA_BITS', 'DEPTH_BITS', 'STENCIL_BITS',
    'SUBPIXEL_BITS', 'SAMPLE_BUFFERS', 'SAMPLES', 'MAX_TEXTURE_MAX_ANISOTROPY_EXT',
    'MAX_3D_TEXTURE_SIZE', 'MAX_ARRAY_TEXTURE_LAYERS', 'MAX_DRAW_BUFFERS', 'MAX_COLOR_ATTACHMENTS',
    'MAX_ELEMENT_INDEX', 'MAX_UNIFORM_BUFFER_BINDINGS', 'MAX_UNIFORM_BLOCK_SIZE',
    'MAX_VERTEX_OUTPUT_COMPONENTS', 'MAX_FRAGMENT_INPUT_COMPONENTS', 'MAX_SAMPLES',
    'MAX_COMBINED_UNIFORM_BLOCKS', 'MAX_VERTEX_UNIFORM_BLOCKS', 'MAX_FRAGMENT_UNIFORM_BLOCKS',
    'MAX_TEXTURE_LOD_BIAS', 'MAX_CLIENT_WAIT_TIMEOUT_WEBGL', 'MAX_TRANSFORM_FEEDBACK_SEPARATE_ATTRIBS',
    'MAX_TRANSFORM_FEEDBACK_SEPARATE_COMPONENTS', 'MAX_TRANSFORM_FEEDBACK_INTERLEAVED_COMPONENTS'
  ];
  const params = {};
  for (const name of paramNames) {
    if (gl[name] === undefined) continue;
    let v;
    try {
      v = gl.getParameter(gl[name]);
    } catch (e) {
      v = '读取失败（' + e.name + '）';
    }
    params[name] = v;
    add('graphics', name, v, `gl.getParameter(gl.${name})`);
  }

  const precisionNames = [['LOW_FLOAT', gl.LOW_FLOAT], ['MEDIUM_FLOAT', gl.MEDIUM_FLOAT], ['HIGH_FLOAT', gl.HIGH_FLOAT]];
  for (const [shaderName, shaderType] of [['VERTEX_SHADER', gl.VERTEX_SHADER], ['FRAGMENT_SHADER', gl.FRAGMENT_SHADER]]) {
    for (const [pName, pType] of precisionNames) {
      try {
        const f = gl.getShaderPrecisionFormat(shaderType, pType);
        if (f) add('graphics', `着色器精度 ${shaderName}.${pName}`, `rangeMin=${f.rangeMin} rangeMax=${f.rangeMax} precision=${f.precision}`, 'gl.getShaderPrecisionFormat');
      } catch (e) { /* 忽略单个精度查询失败 */ }
    }
  }

  let extensions = [];
  try {
    extensions = gl.getSupportedExtensions() || [];
  } catch (e) {
    extensions = [];
  }
  add('graphics', 'WebGL 扩展数量', extensions.length, 'gl.getSupportedExtensions()');
  add('graphics', 'WebGL 扩展列表', extensions, 'gl.getSupportedExtensions()');

  FP.webgl = await sha256(JSON.stringify({
    vendor: unmaskedVendor || maskedVendor,
    renderer: unmaskedRenderer || maskedRenderer,
    version: gl.getParameter(gl.VERSION),
    params: plain(params),
    extensions
  }));
  SUMMARY.hashes.webgl = FP.webgl;
  add('graphics', 'WebGL 参数哈希（SHA-256）', FP.webgl, 'SHA-256(真实参数 JSON)', { copy: true });
}

async function collectWebGPU() {
  if (!navigator.gpu) {
    add('graphics', 'WebGPU 适配器', '不支持（navigator.gpu 不存在）', 'navigator.gpu');
    return;
  }
  let adapter = null;
  try {
    adapter = await navigator.gpu.requestAdapter();
  } catch (e) {
    add('graphics', 'WebGPU 适配器', '读取失败：' + (e.name || 'Error'), 'GPU.requestAdapter()');
    return;
  }
  if (!adapter) {
    add('graphics', 'WebGPU 适配器', '不支持（无可用适配器）', 'GPU.requestAdapter()');
    return;
  }

  let info = adapter.info;
  if (!info && typeof adapter.requestAdapterInfo === 'function') {
    try { info = await adapter.requestAdapterInfo(); } catch (e) { info = null; }
  }
  if (info) {
    const out = {};
    for (const k of ['vendor', 'architecture', 'device', 'description']) {
      if (info[k]) out[k] = info[k];
    }
    if (Object.keys(out).length) add('graphics', 'WebGPU 适配器', out, 'GPUAdapter.info');
  }
  if (adapter.isFallbackAdapter !== undefined) {
    add('graphics', 'WebGPU isFallbackAdapter', adapter.isFallbackAdapter, 'GPUAdapter.isFallbackAdapter');
  }
  if (adapter.features && adapter.features.size) {
    add('graphics', 'WebGPU 特性', Array.from(adapter.features), 'GPUAdapter.features');
  }
  if (adapter.limits) {
    const lim = adapter.limits;
    const keys = ['maxTextureDimension2D', 'maxTextureArrayLayers', 'maxBindGroups', 'maxBufferSize', 'maxStorageBufferBindingSize', 'maxComputeWorkgroupStorageSize', 'maxComputeInvocationsPerWorkgroup', 'maxComputeWorkgroupSizeX', 'maxVertexAttributes', 'maxVertexBuffers', 'maxSampledTexturesPerShaderStage', 'maxUniformBuffersPerShaderStage'];
    const out = {};
    for (const k of keys) if (lim[k] !== undefined) out[k] = lim[k];
    if (Object.keys(out).length) add('graphics', 'WebGPU 限制（部分）', out, 'GPUAdapter.limits');
  }
}

async function canvasFingerprint() {
  const c = document.createElement('canvas');
  c.width = 320;
  c.height = 100;
  const x = c.getContext('2d');
  if (!x) return null;
  x.fillStyle = '#f2f4f8';
  x.fillRect(0, 0, 320, 100);
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#1f4e79';
  x.font = '17px Arial';
  x.fillText('Fingerprint 指纹 🦊 0123456789', 6, 24);
  x.fillStyle = '#b04a00';
  x.font = '15px "Times New Roman"';
  x.fillText('Cwm fjordbank glyphs vext quiz', 6, 48);
  x.fillStyle = 'rgba(0,128,255,0.55)';
  x.font = '14px Georgia';
  x.fillText('Cwm fjordbank glyphs vext quiz', 10, 68);
  x.globalCompositeOperation = 'multiply';
  const g = x.createLinearGradient(0, 60, 320, 100);
  g.addColorStop(0, 'rgba(255,0,128,0.6)');
  g.addColorStop(0.5, 'rgba(0,200,120,0.6)');
  g.addColorStop(1, 'rgba(0,120,255,0.6)');
  x.fillStyle = g;
  x.beginPath();
  x.arc(280, 70, 26, 0, Math.PI * 2);
  x.fill();
  x.globalCompositeOperation = 'source-over';
  x.fillStyle = '#333';

async function audioFingerprint() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const ctx = new OAC(1, 44100, 44100);
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = 10000;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -50;
  comp.knee.value = 40;
  comp.ratio.value = 12;
  comp.attack.value = 0;
  comp.release.value = 0.25;
  osc.connect(comp);
  comp.connect(ctx.destination);
  osc.start(0);
  const buf = await ctx.startRendering();
  const data = buf.getChannelData(0);
  let sum = 0;
  for (let i = 4500; i < 5000 && i < data.length; i++) sum += Math.abs(data[i]);
  return {
    sum: sum.toFixed(6),
    hash: await sha256(data.buffer),
    sampleRate: buf.sampleRate,
    length: buf.length
  };
}

function detectFonts() {
  const baselines = ['monospace', 'sans-serif', 'serif'];
  const span = document.createElement('span');
  span.textContent = 'mmmmmmmmmmlli';
  span.style.cssText = 'position:absolute;left:-9999px;top:-9999px;font-size:72px;white-space:nowrap;font-weight:400;font-style:normal;';
  document.body.appendChild(span);
  const measure = (family) => {
    span.style.fontFamily = family;
    return span.getBoundingClientRect().width;
  };
  const base = {};
  for (const b of baselines) base[b] = measure(b);
  const detected = [];
  for (const f of FONT_LIST) {
    for (const b of baselines) {
      const w = measure(`"${f}", ${b}`);
      if (Math.abs(w - base[b]) > 0.1) {
        detected.push(f);
        break;
      }
    }
  }
  span.remove();
  return { detected: Array.from(new Set(detected)), base };
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return String(n);
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(2)} ${units[i]}`;
}

async function fetchJSON(url, ms, signal) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 3000);
  const onAbort = () => ctrl.abort();
  if (signal) {
    if (signal.aborted) {
      clearTimeout(timer);
      throw new DOMException('Aborted', 'AbortError');
    }
    signal.addEventListener('abort', onAbort);
  }
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store', referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
    if (signal) signal.removeEventListener('abort', onAbort);
  }
}

function raceGeo(signal) {
  return new Promise((resolve) => {
    let left = GEO_SOURCES.length;
    let fallback = null;
    let settled = false;
    GEO_SOURCES.forEach((src) => {
      fetchJSON(src.url, 8000, signal)
        .then((json) => src.parse(json))
        .catch(() => null)
        .then((data) => {
          if (settled) return;
          if (data && geoComplete(data)) {
            settled = true;
            resolve({ ...data, source: src.name });
            return;
          }
          if (data && !fallback) fallback = { ...data, source: src.name };
          left--;
          if (left === 0) {
            settled = true;
            resolve(fallback);
          }
        });
    });
  });
}

    pc.onicecandidate = (e) => {
      if (!e.candidate) { finish(); return; }
      const addr = String(e.candidate.candidate).split(' ')[4];
      if (!addr || addr === '0.0.0.0' || addr === '::') return;
      const isPrivate = /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(addr)
        || /^(fe80:|f[cd][0-9a-f]{2}:)/i.test(addr)
        || /\.local$/i.test(addr);
      if (isPrivate) found.add(addr);
    };

      pc.createDataChannel('lan');
      pc.createOffer().then((o) => pc.setLocalDescription(o)).catch(() => {});
    } catch (e) { /* 协商失败则仅返回已收集地址 */ }

async function reverseGeo(lat, lon) {
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
  const [pr, br] = await Promise.allSettled([
    fetchJSON('https://photon.komoot.io/reverse?lat=' + lat + '&lon=' + lon + '&lang=default', 3000),
    fetchJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=zh-Hans', 3000)
  ]);
  const props = (pr.status === 'fulfilled' && pr.value && pr.value.features && pr.value.features[0] && pr.value.features[0].properties) || null;
  const bdc = (br.status === 'fulfilled' && br.value) ? br.value : null;
  if (!props && !bdc) return null;
  const pick = (arr, re) => arr.find((v) => typeof v === 'string' && re.test(v)) || null;
  const district = props
    ? pick([props.district, props.city, props.county, props.state], /(区|县|旗)$/)
    : null;
  const districtFinal = district
    || (bdc && pick([bdc.locality, bdc.city], /(区|县|旗)$/))
    || null;
  const street = props
    ? pick([props.district, props.locality, props.street], /(街道|镇|乡)$/)
    : null;
  return { district: districtFinal, street };
}

let ipGen = 0;
let ipRunningGen = -1;
let ipWaiter = null;

// 可被刷新按钮或网络事件打断的等待
function ipWait(ms) {
  return new Promise((resolve) => {
    const timer = setTimeout(() => { ipWaiter = null; resolve(); }, ms);
    ipWaiter = () => { clearTimeout(timer); ipWaiter = null; resolve(); };
  });
}

const hasPublicIp = () => isIPv4(IPSTATE.v4) || isIPv6(IPSTATE.v6);
const hasGeo = () => !!(IPSTATE.geo && typeof IPSTATE.geo === 'object' && geoComplete(IPSTATE.geo));

function publishIp() {
  refreshLiveDom();
  scheduleRender();
}

// 网络 IP 不做超时放弃：没拿到地址就一直重试，退避上限 30 秒。
// manual 为真时清空旧值重查（刷新按钮），页面自动刷新只重新请求、失败时保留旧值。
function refreshPublicIP(opts) {
  resetProvinceView();
  if (opts && opts.manual) {
    ipGen++;
    if (geoRaceCtrl) geoRaceCtrl.abort();
    IPSTATE.v4 = null;
    IPSTATE.v6 = null;
    IPSTATE.geo = null;
    scheduleRender();
  }
  if (ipWaiter) ipWaiter();
  if (ipRunningGen === ipGen) return;
  ipRunningGen = ipGen;
  const gen = ipGen;
  resolveNetwork(gen)
    .catch((e) => console.warn('[ip]', e))
    .finally(() => { if (ipRunningGen === gen) ipRunningGen = -1; });
}

async function resolveNetwork(gen) {
  let delay = 1500;
  let first = true;
  while (gen === ipGen) {
    const tasks = [];
    if (first || !hasPublicIp()) tasks.push(fetchPublicIpOnce(gen));
    if (first || !hasGeo()) tasks.push(fetchGeoOnce(gen));
    first = false;
    await Promise.all(tasks.map((t) => t.catch(() => null)));
    if (gen !== ipGen || (hasPublicIp() && hasGeo())) return;
    await ipWait(delay);
    delay = Math.min(delay * 2, 30000);
  }
}

async function fetchPublicIpOnce(gen) {
  if (!ipRowsAdded) {
    ipRowsAdded = true;
    liveRow('network', 'net-ipv4', '公网 IPv4', 'api.ipify.org / api64.ipify.org', () => IPSTATE.v4 || '查询中');
    liveRow('network', 'net-ipv6', '公网 IPv6', 'api6.ipify.org / api64.ipify.org', () => IPSTATE.v6 || '查询中');
    liveRow('network', 'net-lan', '本机网络 IP', 'WebRTC 本地候选（无 STUN）', () => IPSTATE.lan);
    liveRow('network', 'net-geo', '出口归属地 / 运营商', 'ipwho.is / ipinfo.io / ip.sb / ipwhois.app / ipquery.io', () => IPSTATE.geo || '查询中');
  }
  await Promise.all([fetchIpv4(gen), fetchIpv6(gen), fetchLan(gen)]);
}

async function fetchIpv4(gen) {
  const ip = await ipifyIp('https://api.ipify.org?format=json');
  if (gen !== ipGen) return;
  if (isIPv4(ip)) { IPSTATE.v4 = ip; publishIp(); return; }
  const fb = await ipifyIp('https://api64.ipify.org?format=json');
  if (gen !== ipGen) return;
  if (isIPv4(fb)) { IPSTATE.v4 = fb; publishIp(); }
  else if (isIPv6(fb) && !IPSTATE.v6) { IPSTATE.v6 = fb; publishIp(); }
}

async function fetchIpv6(gen) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const ip = await ipifyIp('https://api6.ipify.org?format=json', 10000);
    if (gen !== ipGen) return;
    if (isIPv6(ip)) {
      if (!IPSTATE.v6) { IPSTATE.v6 = ip; publishIp(); }
      return;
    }
    if (attempt === 0) await new Promise((r) => setTimeout(r, 2000));
  }
}

async function ipifyIp(url, ms) {
  try {
    const r = await fetchJSON(url, ms || 6000);
    return r && typeof r.ip === 'string' ? r.ip.trim() : null;
  } catch (e) {
    return null;
  }
}

async function fetchLan(gen) {
  if (IPSTATE.lan) return;
  const list = await gatherLocalIPs();
  if (gen !== ipGen || IPSTATE.lan) return;
  IPSTATE.lan = list.length ? list : '未能获取（浏览器隐藏内网地址或改用 mDNS）';
  publishIp();
}

// 中国区运营商以 BGP 归属为准：接口文案可能把电信 IP 写成移动
function applyCarrier(geo) {
  if (!geo || String(geo.country_code || '').toUpperCase() !== 'CN') return;
  const carrier = carrierFromAsn(geo.asn) || carrierFromText(geo.org) || carrierFromText(geo.isp);
  if (carrier) geo.carrier = { zh: carrier, en: CARRIER_EN[carrier] };
}

async function bgpLookup(ip) {
  try {
    const d = await fetchJSON('https://stat.ripe.net/data/prefix-overview/data.json?resource=' + encodeURIComponent(ip), 4000);
    const first = d && d.data && d.data.asns && d.data.asns[0];
    return first ? { asn: Number(first.asn), holder: String(first.holder || '') } : null;
  } catch (e) {
    return null;
  }
}

async function verifyCarrier(geo, gen) {
  if (!geo || String(geo.country_code || '').toUpperCase() !== 'CN' || !geo.ip) return;
  const bgp = await bgpLookup(geo.ip);
  if (!bgp || gen !== ipGen || IPSTATE.geo !== geo) return;
  const carrier = carrierFromAsn(bgp.asn) || carrierFromText(bgp.holder);
  if (!carrier) return;
  const asnText = 'AS' + bgp.asn;
  const changed = !geo.carrier || geo.carrier.zh !== carrier || geo.asn !== asnText;
  geo.carrier = { zh: carrier, en: CARRIER_EN[carrier], holder: bgp.holder };
  geo.bgpAsn = bgp.asn;
  geo.asn = asnText;
  if (changed) publishIp();
}

let geoRaceCtrl = null;

async function fetchGeoOnce(gen) {
  const ctrl = new AbortController();
  geoRaceCtrl = ctrl;
  try {
    const found = await raceGeo(ctrl.signal);
    ctrl.abort();
    if (!found || gen !== ipGen) return;
    IPSTATE.geo = found;
    applyCarrier(found);
    if (found.ip && !hasPublicIp()) {
      if (isIPv4(found.ip)) IPSTATE.v4 = found.ip;
      else if (isIPv6(found.ip)) IPSTATE.v6 = found.ip;
    }
    publishIp();
    verifyCarrier(found, gen).catch(() => {});
    if (!Number.isFinite(found.lat) || !Number.isFinite(found.lon)) return;
    const rev = await reverseGeo(found.lat, found.lon);
    if (gen !== ipGen || !rev || IPSTATE.geo !== found) return;
    found.district = rev.district;
    found.street = rev.street;
    found.rev = 'photon.komoot.io / bigdatacloud.net';
    scheduleRender();
  } finally {
    if (geoRaceCtrl === ctrl) geoRaceCtrl = null;
    ctrl.abort();
  }
}

const mapX = (lon) => lon + 180;
const mapY = (lat) => MAP_VIEW.top + (90 - lat);
const fmtLat = (v) => Math.abs(v).toFixed(2) + '°' + (v >= 0 ? 'N' : 'S');
const fmtLon = (v) => Math.abs(v).toFixed(2) + '°' + (v >= 0 ? 'E' : 'W');

const USERLOC = { state: 'idle', lat: null, lon: null, acc: null, err: null, addr: null, addrState: 'idle' };
const hasUserLoc = () => USERLOC.state === 'done'
  && Number.isFinite(USERLOC.lat) && Number.isFinite(USERLOC.lon);

function requestUserLocation() {
  if (!navigator.geolocation) {
    USERLOC.state = 'error';
    USERLOC.err = '浏览器不支持定位';
    return;
  }
  USERLOC.state = 'pending';
  scheduleRender();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      USERLOC.state = 'done';
      USERLOC.lat = pos.coords.latitude;
      USERLOC.lon = pos.coords.longitude;
      USERLOC.acc = pos.coords.accuracy;
      scheduleRender();
      resolveUserAddress();
    },
    (e) => {
      USERLOC.state = 'error';
      USERLOC.err = e && e.code === 1 ? '已拒绝授权' : e && e.code === 3 ? '定位超时' : '定位不可用';
      scheduleRender();
    },
    { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
  );
}

function regionZh(code, fallback) {
  if (code) {
    try {
      const name = new Intl.DisplayNames(['zh-CN'], { type: 'region' }).of(String(code).toUpperCase());
      if (name) return name;
    } catch (e) { /* 旧浏览器无 DisplayNames */ }
  }
  return fallback || null;
}

async function resolveUserAddress() {
  const lat = USERLOC.lat;
  const lon = USERLOC.lon;
  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
  USERLOC.addrState = 'pending';
  scheduleRender();
  const addr = await reverseAddress(lat, lon);
  if (USERLOC.lat !== lat || USERLOC.lon !== lon) return;
  USERLOC.addr = addr;
  USERLOC.addrState = addr ? 'done' : 'error';
  scheduleRender();
}

async function reverseAddress(lat, lon) {
  const [pr, br] = await Promise.allSettled([
    fetchJSON('https://photon.komoot.io/reverse?lat=' + lat + '&lon=' + lon + '&lang=default', 5000),
    fetchJSON('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat + '&longitude=' + lon + '&localityLanguage=zh-Hans', 5000)
  ]);
  const p = (pr.status === 'fulfilled' && pr.value && pr.value.features && pr.value.features[0])
    ? pr.value.features[0].properties : null;
  const b = (br.status === 'fulfilled' && br.value) ? br.value : null;
  const parts = [];
  const seen = new Set();
  const push = (v) => {
    const t = typeof v === 'string' ? v.trim() : '';
    if (!t) return;
    const core = t.replace(/(特别行政区|自治区|省|市|区|县|旗|州)$/u, '').toLowerCase();
    if (!core || seen.has(core)) return;
    seen.add(core);
    parts.push(t);
  };
  if (p) {
    push(regionZh(p.countrycode, p.country));
    push(p.state);
    push(p.county);
    push(p.city);
    push(p.district);
    push(p.locality);
    push([p.street, p.housenumber].filter(Boolean).join(' '));
    push(p.postcode);
  }
  if (b && parts.length < 2) {
    push(regionZh(b.countryCode, b.countryName));
    push(b.principalSubdivision);
    push(b.city);
    push(b.locality);
    push(b.postcode);
  }
  return parts.length ? parts.join(' · ') : null;
}

function pointInRing(x, y, ring) {
  let inside = false;
  const n = ring.length;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
    const xi = ring[i];
    const yi = ring[i + 1];
    const xj = ring[j];
    const yj = ring[j + 1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function ringDistance(x, y, ring) {
  let min = Infinity;
  const n = ring.length;
  for (let i = 0, j = n - 2; i < n; j = i, i += 2) {
    const ax = ring[j];
    const ay = ring[j + 1];
    const bx = ring[i];
    const by = ring[i + 1];
    const dx = bx - ax;
    const dy = by - ay;
    const len = dx * dx + dy * dy;
    let t = len ? ((x - ax) * dx + (y - ay) * dy) / len : 0;
    t = Math.max(0, Math.min(1, t));
    min = Math.min(min, Math.hypot(x - (ax + t * dx), y - (ay + t * dy)));
  }
  return min;
}

// 命中点所在国家与所属大洲；落在海里时按最近海岸归为「近海」
const LOC_CACHE = new Map();
function locateLatLon(lat, lon) {
  const key = lat.toFixed(2) + ',' + lon.toFixed(2);
  const cached = LOC_CACHE.get(key);
  if (cached) return cached;
  const x = mapX(lon);
  const y = mapY(lat);
  let idx = -1;
  for (let i = 0; i < WORLD.length && idx < 0; i++) {
    const rings = WORLD[i][5];
    for (let r = 0; r < rings.length; r++) {
      if (pointInRing(x, y, rings[r])) {
        idx = i;
        break;
      }
    }
  }
  let spot;
  if (idx >= 0) {
    spot = { name: WORLD_CONT[WORLD[idx][1]], near: false, country: WORLD[idx][0], index: idx };
  } else {
    let best = null;
    for (let i = 0; i < WORLD.length; i++) {
      const rings = WORLD[i][5];
      for (let r = 0; r < rings.length; r++) {
        const d = ringDistance(x, y, rings[r]);
        if (!best || d < best.d) best = { d, i };
      }
    }
    if (best && best.d < 2.5) {
      const c = WORLD[best.i];
      spot = { name: WORLD_CONT[c[1]], near: true, country: c[0], index: best.i };
    } else {
      spot = { name: '海洋', near: false, country: null, index: -1 };
    }
  }
  if (LOC_CACHE.size > 240) LOC_CACHE.clear();
  LOC_CACHE.set(key, spot);
  return spot;
}

let worldPathCache = null;
function worldPaths() {
  if (!worldPathCache) {
    worldPathCache = WORLD.map((c) => c[5].map((ring) => {
      let d = 'M' + ring[0] + ' ' + ring[1];
      for (let i = 2; i < ring.length; i += 2) d += 'L' + ring[i] + ' ' + ring[i + 1];
      return d + 'Z';
    }).join(''));
  }
  return worldPathCache;
}

let worldShapeCache = { match: -2, html: '' };
function worldShapeHtml(match) {
  if (worldShapeCache.match === match) return worldShapeCache.html;
  const paths = worldPaths();
  let html = '';
  for (let i = 0; i < paths.length; i++) {
    html += '<path class="map-country' + (i === match ? ' on' : '') + '" d="' + paths[i] + '"/>';
  }
  worldShapeCache = { match, html };
  return html;
}

const LABEL_MIN_AREA = 10;
let labelOrder = null;
function labelCandidates() {
  if (!labelOrder) {
    labelOrder = WORLD.map((c, i) => i)
      .filter((i) => WORLD[i][2] >= LABEL_MIN_AREA)
      .sort((a, b) => WORLD[b][2] - WORLD[a][2]);
  }
  return labelOrder;
}

const glyphWidth = (ch) => (/[\u3000-\u303f\u4e00-\u9fa5\uff00-\uffef]/.test(ch) ? 1 : 0.56);

function worldLabelHtml(match, limit, fs) {
  const boxes = [];
  const latLabs = [-60, -30, 0, 30, 60];
  latLabs.forEach((g) => boxes.push([1, mapY(g) - 5, 21, mapY(g) + 2]));
  let html = '';
  let placed = 0;
  const place = (i) => {
    const c = WORLD[i];
    const w = [...c[0]].reduce((n, ch) => n + glyphWidth(ch), 0) * fs;
    const left = c[3] - w / 2 - 1;
    const right = c[3] + w / 2 + 1;
    const top = c[4] - fs / 2 - 1;
    const bottom = c[4] + fs / 2 + 1;
    if (left < 1 || right > MAP_VIEW.w - 1 || top < MAP_VIEW.top + 1 || bottom > MAP_VIEW.top + MAP_VIEW.plot - 1) return false;
    for (let b = 0; b < boxes.length; b++) {
      const box = boxes[b];
      if (left < box[2] && right > box[0] && top < box[3] && bottom > box[1]) return false;
    }
    boxes.push([left, top, right, bottom]);
    html += `<text class="map-name" x="${c[3]}" y="${(c[4] + fs * 0.34).toFixed(1)}">${esc(c[0])}</text>`;
    return true;
  };
  if (match >= 0 && place(match)) placed++;
  const order = labelCandidates();
  for (let k = 0; k < order.length && placed < limit; k++) {
    if (order[k] === match) continue;
    if (place(order[k])) placed++;
  }
  return html;
}

  const x = mapX(focus.lon);
  const y = mapY(focus.lat);
  const bottom = MAP_VIEW.top + MAP_VIEW.plot;
  const grid = [];
  for (let g = -180; g <= 180; g += 30) {
    grid.push(`<line x1="${mapX(g)}" y1="${MAP_VIEW.top}" x2="${mapX(g)}" y2="${bottom}" stroke="#e9eef6" stroke-width=".5"/>`);
  }
  for (let g = -60; g <= 60; g += 30) {
    grid.push(`<line x1="0" y1="${mapY(g)}" x2="${MAP_VIEW.w}" y2="${mapY(g)}" stroke="#e9eef6" stroke-width=".5"/>`);
  }
  const lonLabs = [-120, -60, 0, 60, 120].map((g) =>
    `<text x="${mapX(g)}" y="${MAP_VIEW.h - 3}" text-anchor="middle">${g === 0 ? '0°' : Math.abs(g) + '°' + (g > 0 ? 'E' : 'W')}</text>`).join('');
  const latLabs = [-60, -30, 0, 30, 60].map((g) =>
    `<text x="2" y="${mapY(g) + 2}">${g === 0 ? '0°' : Math.abs(g) + '°' + (g > 0 ? 'N' : 'S')}</text>`).join('');
  const ipX = ip ? mapX(ip.lon) : 0;
  const ipY = ip ? mapY(ip.lat) : 0;
  const ipMark = ip
    ? `<circle cx="${ipX}" cy="${ipY}" r="4.6" fill="#3f6fd8" opacity=".14"/>
       <circle cx="${ipX}" cy="${ipY}" r="1.9" fill="#3f6fd8" stroke="#fff" stroke-width=".9"/>`
    : '';
  const ux = user ? mapX(user.lon) : 0;
  const uy = user ? mapY(user.lat) : 0;
  const userMark = user
    ? `<polygon points="${ux},${uy - 4.6} ${ux + 3.8},${uy + 3} ${ux - 3.8},${uy + 3}" fill="#4b8f6b" stroke="#fff" stroke-width=".9" stroke-linejoin="round"/>`
    : '';
  return `<svg viewBox="0 0 ${MAP_VIEW.w} ${MAP_VIEW.h}" role="img" aria-label="世界地图，当前经纬度 ${fmtLat(focus.lat)} ${fmtLon(focus.lon)}">
    <defs><clipPath id="ip-map-clip"><rect x="0" y="${MAP_VIEW.top}" width="${MAP_VIEW.w}" height="${MAP_VIEW.plot}"/></clipPath></defs>
    <rect x="0" y="${MAP_VIEW.top}" width="${MAP_VIEW.w}" height="${MAP_VIEW.plot}" fill="#f4f8fd"/>
    <g clip-path="url(#ip-map-clip)">
      ${grid.join('')}
      ${worldShapeHtml(spot.index)}
      ${worldLabelHtml(spot.index, limit, fs)}
    </g>
    <rect x="0" y="${MAP_VIEW.top}" width="${MAP_VIEW.w}" height="${MAP_VIEW.plot}" fill="none" stroke="#e2e8f2" stroke-width=".6"/>
    <line x1="${x}" y1="${MAP_VIEW.top}" x2="${x}" y2="${bottom}" stroke="#3f6fd8" stroke-width=".8" stroke-dasharray="2.5 2.5" opacity=".6"/>
    <line x1="0" y1="${y}" x2="${MAP_VIEW.w}" y2="${y}" stroke="#3f6fd8" stroke-width=".8" stroke-dasharray="2.5 2.5" opacity=".6"/>
    ${ipMark}
    ${userMark}
    ${lonLabs}${latLabs}
  </svg>`;
}

function userLocNote(u) {
  if (u) {
    const acc = Number.isFinite(u.acc) ? ` ±${Math.round(u.acc)} m` : '';
    const addrText = USERLOC.addrState === 'pending' ? '解析中…'
      : USERLOC.addr ? USERLOC.addr
      : USERLOC.addrState === 'error' ? '未获取' : '';
    const addrLine = addrText
      ? `<div class="ip-map-loc ip-map-addr"><b>物理地址</b><span>${esc(addrText)}</span></div>`
      : '';
    return `<div class="ip-map-loc"><i></i>设备定位：${esc(fmtLat(u.lat))} ${esc(fmtLon(u.lon))}${esc(acc)}</div>${addrLine}`;
  }
  const text = USERLOC.state === 'pending' ? '设备定位：请求中…'
    : USERLOC.state === 'error' ? `设备定位：${USERLOC.err}` : '';
  return text ? `<div class="ip-map-loc"><i class="off"></i>${esc(text)}</div>` : '';
}

const PROVINCE_CAPITAL = {

  辽宁: '沈阳', 吉林: '长春', 黑龙江: '哈尔滨', 上海: '上海', 江苏: '南京',

  海南: '海口', 重庆: '重庆', 四川: '成都', 贵州: '贵阳', 云南: '昆明',
