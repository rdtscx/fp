  新疆: '乌鲁木齐', 台湾: '台北', 香港: '香港', 澳门: '澳门'
};

const PROVINCE_BY_CODE = {};
Object.keys(PROVINCE_ADCODE).forEach((name) => { PROVINCE_BY_CODE[PROVINCE_ADCODE[name]] = name; });

function isChinaGeo(geo) {
  if (!geo) return false;
  const cc = String(geo.country_code || '').toUpperCase();
  if (cc === 'CN' || cc === 'CHN' || cc === 'HK' || cc === 'MO' || cc === 'TW') return true;
  return /china|中国/i.test(String(geo.country || ''));
}

function provinceFromGeo(geo) {
  if (!geo) return null;
  const cc = String(geo.country_code || '').toUpperCase();
  if (cc === 'HK') return { name: '香港', adcode: '810000' };
  if (cc === 'MO') return { name: '澳门', adcode: '820000' };
  if (cc === 'TW') return { name: '台湾', adcode: '710000' };
  if (!isChinaGeo(geo)) return null;
  const region = String(geo.region || '') + ' ' + String(geo.city || '');
  let name = null;
  const hit = CN_PROVINCES.find(([en]) => new RegExp('\\b' + en + '\\b', 'i').test(region));
  if (hit) name = hit[1];
  if (!name) name = Object.keys(PROVINCE_ADCODE).find((n) => region.includes(n)) || null;
  const adcode = name ? PROVINCE_ADCODE[name] : null;
  return adcode ? { name, adcode } : null;
}

function provinceByPointIn(atlas, lat, lon) {
  const d = atlas;
  if (!d) return null;
  for (const f of d.features || []) {
    const g = f.geometry;
    if (!g) continue;
    const polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
    for (const poly of polys) {
      const outer = poly && poly[0];
      if (!outer || outer.length < 4) continue;
      let inside = false;
      for (let i = 0, j = outer.length - 1; i < outer.length; j = i++) {
        const xi = outer[i][0];
        const yi = outer[i][1];
        const xj = outer[j][0];
        const yj = outer[j][1];
        if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
      }
      if (!inside) continue;
      const props = f.properties || {};
      const code = String(props.adcode || '');
      const name = PROVINCE_BY_CODE[code] || String(props.name || '').replace(/(省|市|自治区|特别行政区)$/, '');
      if (name && PROVINCE_ADCODE[name]) return { name, adcode: PROVINCE_ADCODE[name] };
    }
  }
  return null;
}

// 单轮状态：每次 IP 查询重新拉取地图数据，不做跨轮缓存
let PROV_VIEW = { geoRef: null, phase: 'idle' };
let PROV_TOKEN = 0;

function resetProvinceView() {
  PROV_TOKEN++;
  PROV_VIEW = { geoRef: null, phase: 'idle' };
}

function ensureProvinceView() {
  const geo = IPSTATE.geo;
  if (!geo || typeof geo !== 'object') {
    if (PROV_VIEW.geoRef) resetProvinceView();
    return;
  }
  if (PROV_VIEW.geoRef === geo) return;
  if (!isChinaGeo(geo)) {
    PROV_TOKEN++;
    PROV_VIEW = { geoRef: geo, phase: 'overseas' };
    scheduleRender();
    return;
  }
  const token = ++PROV_TOKEN;
  const view = { geoRef: geo, phase: 'loading', name: null, adcode: null };
  PROV_VIEW = view;
  const byRegion = provinceFromGeo(geo);
  if (byRegion) {
    loadProvinceInto(view, byRegion, token);
    return;
  }
  fetchJSON('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json', 12000)
    .then((atlas) => {
      if (token !== PROV_TOKEN) return;
      const prov = provinceByPointIn(atlas, geo.lat, geo.lon);
      if (!prov) {
        view.phase = 'unknown';
        scheduleRender();
        return;
      }
      loadProvinceInto(view, prov, token);
    })
    .catch(() => {
      if (token === PROV_TOKEN) {
        view.phase = 'error';
        scheduleRender();
      }
    });
}

function loadProvinceInto(view, prov, token) {
  view.name = prov.name;
  view.adcode = prov.adcode;
  fetchJSON('https://geo.datav.aliyun.com/areas_v3/bound/' + prov.adcode + '_full.json', 12000)
    .then((data) => {
      if (token !== PROV_TOKEN) return;
      buildProvince(view, data);
      view.phase = 'ready';
      scheduleRender();
    })
    .catch(() => {
      if (token === PROV_TOKEN) {
        view.phase = 'error';
        scheduleRender();
      }
    });
}

function simplifyLatLon(ring, tol) {
  if (ring.length < 5) return ring;
  const keep = new Uint8Array(ring.length);
  keep[0] = 1;
  keep[ring.length - 1] = 1;
  const stack = [[0, ring.length - 1]];
  while (stack.length) {
    const [a, b] = stack.pop();
    if (b - a < 2) continue;
    const ax = ring[a][0];
    const ay = ring[a][1];
    const bx = ring[b][0];
    const by = ring[b][1];
    const dx = bx - ax;
    const dy = by - ay;
    const len = Math.hypot(dx, dy);
    let idx = -1;
    let dmax = tol;
    for (let i = a + 1; i < b; i++) {
      const px = ring[i][0];
      const py = ring[i][1];
      const d = len
        ? Math.abs(dy * px - dx * py + bx * ay - by * ax) / len
        : Math.hypot(px - ax, py - ay);
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (idx > 0) {
      keep[idx] = 1;
      stack.push([a, idx], [idx, b]);
    }
  }
  const out = [];
  for (let i = 0; i < ring.length; i++) if (keep[i]) out.push(ring[i]);
  return out;
}

function ringAreaLatLon(ring) {
  let s = 0;
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i];
    const b = ring[(i + 1) % ring.length];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return s / 2;
}

function buildProvince(st, geoData) {
  const feats = (geoData && geoData.features) || [];
  const cities = [];
  let lonMin = Infinity;
  let lonMax = -Infinity;
  let latMin = Infinity;
  let latMax = -Infinity;
  feats.forEach((f) => {
    const g = f.geometry;
    if (!g) return;
    const polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
    const rings = [];
    let area = 0;
    polys.forEach((poly) => {
      const outer = poly && poly[0];
      if (!outer || outer.length < 4) return;
      const ring = simplifyLatLon(outer, 0.006);
      if (ring.length < 4) return;
      rings.push(ring);
      area += Math.abs(ringAreaLatLon(ring));
      ring.forEach(([lon, lat]) => {
        if (lon < lonMin) lonMin = lon;
        if (lon > lonMax) lonMax = lon;
        if (lat < latMin) latMin = lat;
        if (lat > latMax) latMax = lat;
      });
    });
    if (!rings.length) return;
    const props = f.properties || {};
    const c = props.centroid || props.center;
    cities.push({ name: String(props.name || ''), rings, area, at: c ? [c[0], c[1]] : rings[0][0] });
  });
  if (!cities.length) throw new Error('no cities');

  const kLon = Math.cos(((latMin + latMax) / 2) * Math.PI / 180);
  const rawW = Math.max(0.5, (lonMax - lonMin) * kLon);
  const rawH = Math.max(0.5, latMax - latMin);
  const pad = 16;
  const scale = Math.min((620 - pad * 2) / rawW, (420 - pad * 2) / rawH);
  const W = Math.round(rawW * scale + pad * 2);
  const H = Math.round(rawH * scale + pad * 2);
  const project = (lon, lat) => [pad + (lon - lonMin) * kLon * scale, pad + (latMax - lat) * scale];

  cities.forEach((c) => {
    c.d = c.rings.map((ring) => 'M' + ring.map(([lon, lat]) => {
      const p = project(lon, lat);
      return p[0].toFixed(1) + ' ' + p[1].toFixed(1);
    }).join('L') + 'Z').join('');
  });

  const span = Math.max(lonMax - lonMin, latMax - latMin);
  const step = span > 12 ? 2 : span > 6 ? 1 : 0.5;
  const grid = [];
  const gridLabels = [];
  for (let lon = Math.ceil(lonMin / step) * step; lon <= lonMax + 0.001; lon += step) {
    const x = project(lon, latMax)[0];
    grid.push(`<line x1="${x}" y1="${pad}" x2="${x}" y2="${H - pad}" stroke="#e9eef6" stroke-width=".5"/>`);
    gridLabels.push(`<text x="${x}" y="${H - 4}" text-anchor="middle">${fmtLon(lon)}</text>`);
  }
  for (let lat = Math.ceil(latMin / step) * step; lat <= latMax + 0.001; lat += step) {
    const y = project(lonMin, lat)[1];
    grid.push(`<line x1="${pad}" y1="${y}" x2="${W - pad}" y2="${y}" stroke="#e9eef6" stroke-width=".5"/>`);
    gridLabels.push(`<text x="2" y="${y + 2}">${fmtLat(lat)}</text>`);
  }

  cities.sort((a, b) => b.area - a.area);
  const capital = PROVINCE_CAPITAL[st.name] || '';
  const cap = cities.find((c) => c.name.replace(/(市|地区|自治州|盟)$/, '') === capital);
  const order = cap ? [cap].concat(cities.filter((c) => c !== cap)) : cities.slice();

  st.W = W;
  st.H = H;
  st.pad = pad;
  st.project = project;
  st.cities = cities;
  st.order = order;
  st.grid = grid.join('');
  st.gridLabels = gridLabels.join('');
}

function pointInRingsLL(lon, lat, rings) {
  for (const ring of rings) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const xi = ring[i][0];
      const yi = ring[i][1];
      const xj = ring[j][0];
      const yj = ring[j][1];
      if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
    }
    if (inside) return true;
  }
  return false;
}

function provinceLabelHtml(st, limit, fs, focus) {
  const boxes = [];
  let html = '';
  let placed = 0;
  let focusCity = null;
  if (focus) {
    for (const c of st.order) {
      if (pointInRingsLL(focus.lon, focus.lat, c.rings)) { focusCity = c; break; }
    }
  }
  const order = focusCity ? [focusCity].concat(st.order.filter((c) => c !== focusCity)) : st.order;
  for (const c of order) {
    if (placed >= limit) break;
    const [x, y] = st.project(c.at[0], c.at[1]);
    const name = c.name.replace(/(市|地区|自治州|盟|区|县|旗)$/, '');
    const w = [...name].reduce((n, ch) => n + glyphWidth(ch), 0) * fs;
    const left = x - w / 2 - 1;
    const right = x + w / 2 + 1;
    const top = y - fs / 2 - 1;
    const bottom = y + fs / 2 + 1;
    if (left < 2 || right > st.W - 2 || top < 2 || bottom > st.H - 2) continue;
    let hit = false;
    for (const b of boxes) {
      if (left < b[2] && right > b[0] && top < b[3] && bottom > b[1]) { hit = true; break; }
    }
    if (hit) continue;
    boxes.push([left, top, right, bottom]);
    html += `<text class="map-name" x="${x}" y="${(y + fs * 0.34).toFixed(1)}">${esc(name)}</text>`;
    placed++;
  }
  return html;
}

function provinceSvg(st, focus, ip, user) {
  const narrow = window.innerWidth <= 980;
  const fs = narrow ? 10 : 9;
  const limit = window.innerWidth <= 440 ? 8 : narrow ? 10 : 14;
  const [x, y] = st.project(focus.lon, focus.lat);
  const shapes = st.order.map((c) => `<path class="map-city" d="${c.d}"/>`).join('');
  const labels = provinceLabelHtml(st, limit, fs, focus);
  const ipMark = ip
    ? (() => {
      const p = st.project(ip.lon, ip.lat);
      return `<circle cx="${p[0]}" cy="${p[1]}" r="4.6" fill="#3f6fd8" opacity=".14"/>
        <circle cx="${p[0]}" cy="${p[1]}" r="1.9" fill="#3f6fd8" stroke="#fff" stroke-width=".9"/>`;
    })()
    : '';
  const userMark = user
    ? (() => {
      const p = st.project(user.lon, user.lat);
      return `<polygon points="${p[0]},${p[1] - 4.6} ${p[0] + 3.8},${p[1] + 3} ${p[0] - 3.8},${p[1] + 3}" fill="#4b8f6b" stroke="#fff" stroke-width=".9" stroke-linejoin="round"/>`;
    })()
    : '';
  return `<svg viewBox="0 0 ${st.W} ${st.H}" role="img" aria-label="${esc(st.name)}地图，当前经纬度 ${fmtLat(focus.lat)} ${fmtLon(focus.lon)}">
    <defs><clipPath id="prov-clip"><rect x="0" y="0" width="${st.W}" height="${st.H}"/></clipPath></defs>
    <rect x="0" y="0" width="${st.W}" height="${st.H}" fill="#f4f8fd"/>
    <g clip-path="url(#prov-clip)">
      ${st.grid}
      ${shapes}
      ${labels}
      ${st.gridLabels}
    </g>
    <line x1="${x}" y1="0" x2="${x}" y2="${st.H}" stroke="#3f6fd8" stroke-width=".8" stroke-dasharray="2.5 2.5" opacity=".6"/>
    <line x1="0" y1="${y}" x2="${st.W}" y2="${y}" stroke="#3f6fd8" stroke-width=".8" stroke-dasharray="2.5 2.5" opacity=".6"/>
    ${ipMark}
    ${userMark}
  </svg>`;
}

function ipMapHtml(geo) {
  const ip = (geo && Number.isFinite(geo.lat) && Number.isFinite(geo.lon))
    ? { lat: geo.lat, lon: geo.lon } : null;
  const user = hasUserLoc() ? { lat: USERLOC.lat, lon: USERLOC.lon, acc: USERLOC.acc } : null;
  const loc = userLocNote(user);

  if (!geo) {
    return `<div class="ip-map"><div class="ip-map-head"><b>位置地图</b><span class="ip-map-continent">查询中</span></div><div class="ip-map-empty">正在查询网络 IP…</div>${loc}</div>`;
  }

  const focus = ip || user;
  if (!focus) {
    return `<div class="ip-map"><div class="ip-map-head"><b>位置地图</b><span class="ip-map-continent">查询中</span></div><div class="ip-map-empty">取得经纬度后自动绘制</div>${loc}</div>`;
  }

  const coords = `${fmtLat(focus.lat)} ${fmtLon(focus.lon)}`;
  const key = `<span class="ip-map-key"><i></i>IP 归属地<i class="tri"></i>设备定位</span>`;
  const foot = `<div class="ip-map-foot">${key}<code>${esc(coords)}</code></div>`;

  if (isChinaGeo(geo)) {
    ensureProvinceView();
    const v = PROV_VIEW;
    const head = `<div class="ip-map-head"><b>位置地图</b><span class="ip-map-continent">中国${v.name ? ' · ' + esc(v.name) : ''}</span></div>`;
    if (v.phase === 'ready' && v.geoRef === geo) {
      return `<div class="ip-map">${head}${provinceSvg(v, focus, ip, user)}${foot}${loc}</div>`;
    }
    const msg = v.phase === 'error'
      ? '省份地图加载失败，点“刷新”重试'
      : v.phase === 'unknown'
        ? '未能识别省份，点“刷新”重试'
        : v.name ? `正在加载${v.name}地图…` : '正在识别省份…';
    return `<div class="ip-map">${head}<div class="ip-map-empty">${esc(msg)}</div>${foot}${loc}</div>`;
  }

  const spot = locateLatLon(focus.lat, focus.lon);
  const where = spot.name + (spot.near ? '（近海）' : '') + (spot.country ? ' · ' + spot.country : '');
  const head = `<div class="ip-map-head"><b>位置地图</b><span class="ip-map-continent">${esc(where)}</span></div>`;
  return `<div class="ip-map">${head}${ipMapSvg(spot, focus, ip, user)}${foot}${loc}</div>`;
}

function parseCandidate(c) {
  const p = String(c).split(/\s+/);
  return { raw: c, protocol: p[2] || '', address: p[4] || '', port: p[5] || '', type: p[7] || '' };
}

async function collectWebRTC() {
  if (typeof window.RTCPeerConnection !== 'function') {
    add('webrtc', 'ICE 候选地址', '不支持（RTCPeerConnection 不存在）', 'RTCPeerConnection');
    return;
  }
  let pc = null;
  try {
    pc = new RTCPeerConnection({ iceServers: [] });
  } catch (e) {
    add('webrtc', 'ICE 候选地址', '读取失败：' + (e.name || 'Error'), 'RTCPeerConnection');
    return;
  }
  const candidates = new Set();
  pc.onicecandidate = (e) => {
    if (e.candidate && e.candidate.candidate) candidates.add(e.candidate.candidate);
  };
  try {
    pc.createDataChannel('fp');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  } catch (e) { /* 协商失败则不展示 */ }
  await sleep(1000);
  const raw = Array.from(candidates);
  try { pc.close(); } catch (e) { /* 已关闭 */ }
  if (!raw.length) {
    add('webrtc', 'ICE 候选地址', '未能收集到候选（1.8 秒窗口内无地址返回）', 'RTCPeerConnection');
    return;
  }
  add('webrtc', 'ICE 候选地址', raw.map(parseCandidate), 'RTCPeerConnection（未配置 STUN/TURN，1 秒窗口）');
}

function collectPlugins() {

  }));
  if (plugins.length) add('plugins', '插件', plugins, 'navigator.plugins');
  else add('plugins', '插件', '无（浏览器未返回插件）', 'navigator.plugins');

  const mimes = Array.from(navigator.mimeTypes || []).map((m) => ({
    type: m.type,
    suffixes: m.suffixes || undefined,
    description: m.description || undefined,
    enabledPlugin: m.enabledPlugin ? m.enabledPlugin.name : undefined
  }));
  if (mimes.length) add('plugins', 'MIME 类型', mimes, 'navigator.mimeTypes');
  else add('plugins', 'MIME 类型', '无（浏览器未返回 MIME 类型）', 'navigator.mimeTypes');

const PHASE_A_SECTIONS = ['browser', 'hardware', 'screen', 'locale', 'graphics', 'hashes', 'fonts', 'audio', 'page', 'plugins', 'features', 'css'];

async function computeSummaries() {
  if (SUMMARY.hashes.stable) return;
  const stable = {
    canvas: FP.canvas || null,
    audio: FP.audioHash || null,
    webgl: FP.webgl || null,
    layout: FP.layoutHash || null,
    fonts: FP.fontsHash || null,
    screen: [screen.width, screen.height, screen.availWidth, screen.availHeight, screen.colorDepth],
    dpr: Number(devicePixelRatio.toFixed(3)),
    touch: navigator.maxTouchPoints,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    languages: navigator.languages,
    platform: navigator.platform
  };
  const composite = {
    ...stable,
    ua: navigator.userAgent,
    uaFullVersion: uaHigh ? (uaHigh.uaFullVersion || null) : null,
    engine: SUMMARY.engine
  };
  const stableHash = await sha256(JSON.stringify(stable));
  const compositeHash = await sha256(JSON.stringify(composite));
  if (stableHash) SUMMARY.hashes.stable = stableHash;
  if (compositeHash) SUMMARY.hashes.composite = compositeHash;
  if (stableHash) add('hashes', '稳定设备指纹（SHA-256）', stableHash, 'SHA-256（稳定字段）', { copy: true });
  if (compositeHash) add('hashes', '综合指纹（含 UA 版本，SHA-256）', compositeHash, 'SHA-256（稳定字段 + UA / 引擎版本）', { copy: true });
}

async function collectVoices() {
  const ss = window.speechSynthesis;
  if (!ss) {
    add('audio', '语音合成 voices', '不支持（speechSynthesis 不存在）', 'window.speechSynthesis');
    return;
  }
  const voices = await new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); };
    const read = () => finish(ss.getVoices() || []);
    const initial = ss.getVoices();
    if (initial && initial.length) { finish(initial); return; }
    const timer = setTimeout(read, 1000);
    try {
      ss.addEventListener('voiceschanged', () => { clearTimeout(timer); read(); }, { once: true });
    } catch (e) {
      clearTimeout(timer);
      read();
    }
  });
  if (!voices.length) {
    add('audio', '语音合成 voices', '未能获取（浏览器未返回音色列表）', 'speechSynthesis.getVoices()');
    return;
  }
  add('audio', '语音合成 voices', voices.map((v) => `${v.name} (${v.lang})${v.localService ? ' · 本地' : ' · 网络'}`), 'speechSynthesis.getVoices()');
}

function markDone(ids) {
  for (const id of ids) {
    const st = STATE.get(id);
    if (st) st.done = true;
  }
}

function markAllDone() {
  for (const def of SEC_DEFS) {
    const st = STATE.get(def.id);
    if (st) st.done = true;
  }
}

async function collectHeavy() {
  await run('WebGL', collectGraphics);
  await Promise.allSettled([
    run('指纹哈希', collectHashes),
    run('音频', collectAudio)
  ]);
  await computeSummaries();
  markDone(PHASE_A_SECTIONS);
}

async function phaseB() {
  await Promise.allSettled([
    run('WebGPU', collectWebGPU),
    run('电池', collectBattery),
    run('权限', collectPermissions),
    run('存储', collectStorage),
    run('媒体', collectMedia),
    run('网络', collectNetwork),
    run('WebRTC', collectWebRTC),
    run('语音', collectVoices),
    run('隐私', collectPrivacy)
  ]);
}

async function startFresh() {
  META.startedAt = performance.now();
  META.generatedAt = new Date().toISOString();
  META.pageUrl = location.href;
  META.referrer = document.referrer;
  META.userAgent = navigator.userAgent;
  UI.status = 'loading';
  render();

  await run('浏览器与内核', collectBrowser);

  runSync('系统与硬件', collectHardware);
  runSync('屏幕与视口', collectScreen);
  runSync('语言与时区', collectLocale);
  runSync('页面与性能', collectPage);
  runSync('插件与 MIME', collectPlugins);
  runSync('API 特性', collectFeatures);
  runSync('CSS 能力', collectCSS);

  UI.status = 'partial';
  render();

  const ipTask = refreshPublicIP();
  await Promise.allSettled([collectHeavy(), phaseB(), ipTask]);

  markAllDone();
  UI.allDone = true;
  META.durationMs = Math.round(performance.now() - META.startedAt);
  UI.status = 'done';
  render();
}

async function boot() {
  META.startedAt = performance.now();
  META.pageUrl = location.href;
  META.referrer = document.referrer;
  META.userAgent = navigator.userAgent;
  SUMMARY.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  SUMMARY.lang = (navigator.languages || [navigator.language]).join(', ');
  SUMMARY.screen = `${screen.width}×${screen.height} · DPR ${devicePixelRatio}`;

  try {
    Object.keys(localStorage).filter((k) => k.indexOf('bfp:report:') === 0).forEach((k) => localStorage.removeItem(k));
    localStorage.removeItem('fp:rev:v1');
    localStorage.removeItem('fp:rev:v2');
  } catch (e) { /* 清理旧版本缓存失败时忽略 */ }

  UI.status = 'loading';
  render();
  startLiveRefresh();
  requestUserLocation();
  startFresh().catch((e) => console.warn('[startFresh]', e));
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();
