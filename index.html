<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>浏览器指纹与真实参数报告</title>
<style>
:root{
  --bg:#070b10;
  --panel:#0d1620;
  --panel2:#0a121a;
  --line:#1b2a39;
  --line2:#24384a;
  --text:#e8f0f8;
  --muted:#8aa0b6;
  --dim:#5f7d96;
  --accent:#4cc9f0;
  --violet:#a78bfa;
  --ok:#2dd4bf;
  --warn:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark;scroll-behavior:smooth}
body{
  margin:0;color:var(--text);line-height:1.55;
  background:
    radial-gradient(1100px 520px at 12% -12%,rgba(76,201,240,.10),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(167,139,250,.07),transparent 55%),
    var(--bg);
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:#dff3ff;background:#0e2231;border:1px solid #1b3a4c;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11.5px;line-height:1.4;transition:border-color .15s,color .15s,background .15s}
button:hover{border-color:#2d6b86;color:#fff}
button.primary{background:linear-gradient(135deg,#0c6f8a,#155e75);border-color:#1c7f9e;color:#eaffff;font-weight:600}
button.primary:hover{background:linear-gradient(135deg,#0f819f,#1a708b)}
button.copy{background:transparent;border-color:#1c2e3e;color:#7895ad;padding:1px 6px;font-size:10px;margin-left:8px;border-radius:6px}
button.copy:hover{color:#7fe3ff;border-color:#2c6d8a}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,11,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(27,42,57,.9)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:180px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--violet));color:#04121d;font-weight:800;font-size:11px;display:grid;place-items:center;letter-spacing:.6px;box-shadow:0 4px 14px rgba(76,201,240,.18)}
.brand strong{display:block;font-size:13px;letter-spacing:.01em}
.brand small{display:block;color:var(--dim);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;padding:4px 9px;border-radius:999px;border:1px solid #1b2c3a;color:var(--muted);white-space:nowrap;background:#0a141d;margin-left:auto}
.status .dot{width:6px;height:6px;border-radius:50%;background:#64748b;flex-shrink:0}
.status.loading{color:#fbbf24;border-color:#4a3a1a;background:#1a1408}
.status.loading .dot{background:#fbbf24;animation:pulse 1s infinite}
.status.partial{color:#7dd3fc;border-color:#1d4a66;background:#081a26}
.status.partial .dot{background:#38bdf8;animation:pulse 1.2s infinite}
.status.done{color:#5eead4;border-color:#1b4a3e;background:#081f1a}
.status.done .dot{background:#2dd4bf}
.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.search{position:relative;display:flex;align-items:center}
.search .icon{position:absolute;left:9px;width:10px;height:10px;border:1.5px solid var(--dim);border-radius:50%;pointer-events:none}
.search .icon::after{content:"";position:absolute;width:5px;height:1.5px;background:var(--dim);transform:rotate(45deg);left:8px;top:9px}
.search input{font:inherit;font-size:11.5px;color:var(--text);background:#08111a;border:1px solid #182a39;border-radius:8px;padding:6px 56px 6px 27px;outline:none;width:220px;transition:border-color .15s,box-shadow .15s}
.search input::placeholder{color:#4f6a82}
.search input:focus{border-color:#2a6a86;box-shadow:0 0 0 3px rgba(76,201,240,.08)}
.search #filter-count{position:absolute;right:8px;font-size:9.5px;color:#5f7d96;pointer-events:none}
.progress{height:2px;background:transparent;overflow:hidden}
.progress.active{background:#0f1b27}
.progress span{display:block;height:100%;width:30%;background:linear-gradient(90deg,transparent,var(--accent),var(--violet),transparent);animation:slide 1.3s linear infinite}
.progress:not(.active) span{display:none}

.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 48px}

/* hero */
.hero{position:relative;border:1px solid var(--line);border-radius:20px;padding:24px;background:radial-gradient(900px 300px at 8% 0%,rgba(76,201,240,.10),transparent 62%),linear-gradient(160deg,#0b1520,#091018 72%);overflow:hidden;margin-bottom:12px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 60%,rgba(167,139,250,.05));pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:26px;align-items:start}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
h1{font-size:clamp(21px,3vw,31px);margin:5px 0 7px;line-height:1.22;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:12.5px;margin:0 0 14px;max-width:760px}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:10.5px;color:var(--dim);align-items:center}
.hero-meta span{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid #162432;border-radius:999px;background:#0a131c;max-width:100%;word-break:break-word}
.live-pill{color:#5eead4;border-color:#1b4a3e!important;background:#081f1a!important}
.fingerprint-card{background:#08111a;border:1px solid #1b3a4c;border-radius:15px;padding:15px 16px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.hash-row{padding:9px 0;border-top:1px dashed #16293a}
.hash-row:first-child{border-top:0;padding-top:0}
.hash-label{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.hash-value{display:block;font-family:var(--mono);font-size:12px;color:#7fe3ff;word-break:break-all;line-height:1.65;margin:5px 0 0;min-height:16px}
.hash-row .copy{margin-top:5px}
.hash-sub{font-size:10px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dashed #16293a;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{background:#0a131c;border:1px solid #162432;border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:9px;letter-spacing:.12em;color:var(--dim);font-weight:600;text-transform:uppercase;margin-bottom:2px}
.stat span{font-size:11.5px;color:var(--text);word-break:break-word;display:block;line-height:1.45}
.mini{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;position:relative;z-index:1}
.mini .chip{font-family:var(--mono);font-size:10px}
.skeleton{display:block;background:linear-gradient(90deg,#0e1a25,#172936,#0e1a25);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:5px}
.sk-line{height:12px;width:78%}
.sk-card{height:110px;margin-bottom:10px}
.sk-chip{height:16px;width:100px;display:inline-block}

/* nav */
.nav{display:flex;align-items:center;gap:10px;margin:10px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(10,17,24,.72)}
.nav-links{display:flex;gap:4px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{white-space:nowrap;color:var(--muted);text-decoration:none;font-size:11px;padding:5px 9px;border-radius:8px;display:inline-flex;gap:6px;align-items:center;transition:background .15s,color .15s}
.nav-links a:hover{background:#0f1d29;color:var(--text)}
.nav-links a.active{background:#0d2633;color:#9fe8ff;box-shadow:inset 0 0 0 1px #1b4a5e}
.nav-links b{font-weight:600;color:var(--dim);font-size:9px;background:#0a141d;border:1px solid #142433;border-radius:4px;padding:0 4px;margin-left:1px}
.nav-tools{display:flex;gap:4px;flex-shrink:0}
.nav-tools button{padding:4px 8px;font-size:10px;background:#0b1721}

/* cards */
.card{background:linear-gradient(180deg,#0d1620,#0a121a);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden;scroll-margin-top:86px}
.card summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;list-style:none;user-select:none;transition:background .15s}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{background:#0e1a25}
.sum-main{min-width:0;display:block}
.title{display:block;font-size:14px;font-weight:600;color:var(--text);letter-spacing:.005em}
.desc{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5}
.sum-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.count{font-size:10px;color:var(--dim);background:#0a141d;border:1px solid #172735;border-radius:999px;padding:2px 8px;white-space:nowrap}
.chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin:0 5px}
.card[open] .chev{transform:rotate(-135deg)}
.pending-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(76,201,240,.12);animation:pulse 1.2s infinite}
.sec-body{padding:0 16px 14px;border-top:1px solid #13202c}
.rows{padding-top:2px}

/* rows */
.row{display:grid;grid-template-columns:minmax(145px,225px) minmax(0,1fr);gap:16px;padding:8px 0;border-top:1px dashed #16222f;align-items:start}
.row:first-child{border-top:0}
.row .k{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 8px}
.label{display:inline;font-size:12px;color:#cfe0ef;word-break:break-word}
.src{display:inline;font-size:9px;font-family:var(--mono);color:#5f7d96;margin:0;word-break:break-word;line-height:1.45;background:#0a141d;border:1px solid #142433;border-radius:4px;padding:0 4px}
.vcell{min-width:0;font-size:12px;line-height:1.6}
.v{word-break:break-word;white-space:pre-wrap}
.v.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:4.8em}
.mono{font-family:var(--mono);font-size:11.5px}
.ratio{font-size:9.5px;color:#4f728c;margin-left:6px;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#0b1721;border:1px solid #1a2c3c;border-radius:6px;padding:2px 7px;font-size:10.5px;color:#cfe6f8;word-break:break-word;max-width:100%}
.chip.ok{background:#081f1a;border-color:#1b4a3e;color:#a7f3d0}
.fgrid{display:flex;flex-wrap:wrap;gap:5px}
pre.json{margin:0;padding:9px 11px;background:#08111a;border:1px solid #16222f;border-radius:8px;font-family:var(--mono);font-size:10.5px;color:#b9d6ee;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.muted{color:var(--dim);font-size:11.5px}

/* states */
.loading-panel{color:var(--muted);font-size:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0a121a;margin:10px 0}
.loading-panel p{margin:8px 0 0}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:22px;border:1px dashed #1b2a39;border-radius:12px;margin:10px 0;background:#09111a}
#filter-empty{margin:14px 0}
footer{color:#5b748b;font-size:10.5px;margin-top:26px;line-height:1.7;border-top:1px solid #13202c;padding-top:14px}
footer p{margin:3px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#0e2536;border:1px solid #1d5a7a;color:#dff3ff;padding:8px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(430%)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media (max-width:880px){
  .hero-grid{grid-template-columns:1fr;gap:16px}
  .fingerprint-card{box-shadow:none}
}
@media (max-width:700px){
  .topbar-inner{padding:8px 10px;gap:8px}
  .brand{min-width:0}
  .brand small{display:none}
  .status{order:2;margin-left:auto;font-size:10px;padding:3px 8px}
  .actions{order:3;width:100%;gap:6px}
  .search{flex:1;min-width:0}
  .search input{width:100%;padding-right:52px}
  .actions button{padding:6px 8px;font-size:10.5px}
  .actions button.primary{padding:6px 9px}
  .wrap{padding:12px 10px 40px}
  .hero{padding:17px 15px;border-radius:16px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .nav{flex-wrap:wrap;padding:7px 8px}
  .nav-tools{display:none}
  .card summary{padding:12px 13px}
  .sec-body{padding:0 13px 12px}
  .row{grid-template-columns:1fr;gap:2px;padding:7px 0}
  .desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100vw - 120px)}
  .mini .chip{flex:1 1 100%;justify-content:space-between}
  .hash-value{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">FP</span>
      <div><strong>Browser Fingerprint</strong><small>真实参数报告</small></div>
    </div>
    <div class="status loading" id="status"><span class="dot"></span><span id="status-text">准备中</span></div>
    <div class="actions">
      <label class="search">
        <span class="icon"></span>
        <input id="q" type="search" placeholder="搜索参数或值" autocomplete="off" spellcheck="false">
        <span id="filter-count"></span>
      </label>
      <button id="btn-copy-all">复制 JSON</button>
      <button id="btn-download">下载</button>
      <button id="btn-reload" class="primary">重新采集</button>
    </div>
  </div>
  <div class="progress" id="progress"><span></span></div>
</header>

<main class="wrap">
  <nav class="nav" id="nav" hidden>
    <div class="nav-links" id="nav-links"></div>
    <div class="nav-tools">
      <button id="btn-expand">展开全部</button>
      <button id="btn-collapse">收起全部</button>
    </div>
  </nav>
  <section id="hero" class="hero"></section>
  <div id="sections"></div>
  <div id="filter-empty" class="empty" hidden>没有匹配的参数</div>
  <footer>
    <p>仅展示当前浏览器实际返回的数据；不支持的接口、失败项和空值已自动隐藏。</p>
    <p>页面为纯静态，无后端。除公网 IP / 归属地会请求 api.ipify.org、api64.ipify.org、ipwho.is、ipinfo.io 外，数据不上传；每次打开都会重新采集，不使用本地缓存。</p>
  </footer>
</main>

<div id="toast" class="toast"></div>
<noscript><p style="color:#f87171;padding:20px">本页需要启用 JavaScript 才能采集参数。</p></noscript>

<script>
(() => {
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeBool = (fn) => { try { return !!fn(); } catch (e) { return false; } };

const FONT_LIST = [
  'Arial','Arial Black','Arial Narrow','Arial Rounded MT Bold','Bahnschrift','Baskerville','Bookman Old Style',
  'Calibri','Cambria','Candara','Century Gothic','Comic Sans MS','Consolas','Constantia','Corbel','Courier New',
  'DejaVu Sans','DejaVu Sans Mono','DejaVu Serif','Didot','Franklin Gothic Medium','Futura','Garamond','Geneva',
  'Georgia','Gill Sans','Helvetica','Helvetica Neue','Impact','Liberation Mono','Liberation Sans','Liberation Serif',
  'Lucida Console','Lucida Grande','Lucida Sans Unicode','Menlo','Monaco','MS Gothic','MS PGothic','MS Sans Serif',
  'MS Serif','Nimbus Roman','Nimbus Sans','Optima','Palatino','Palatino Linotype','Roboto','Roboto Mono',
  'Segoe Print','Segoe Script','Segoe UI','Segoe UI Emoji','SF Pro Display','SF Pro Text','SF Mono','San Francisco',
  'Tahoma','Times','Times New Roman','Trebuchet MS','Ubuntu','Ubuntu Mono','Verdana','Webdings','Wingdings',
  'Cantarell','Noto Sans','Noto Serif','Noto Sans Mono','Fira Sans','Fira Code','Open Sans','Lato','Montserrat','Inter',
  'JetBrains Mono','Source Code Pro','Cascadia Code','Apple Color Emoji','Apple Symbols','Avenir','Avenir Next',
  'Cochin','Copperplate','Marker Felt','Papyrus','Skia','Droid Sans','Droid Sans Fallback','Droid Serif',
  'Microsoft YaHei','Microsoft JhengHei','SimSun','NSimSun','SimHei','FangSong','KaiTi','MingLiU','PMingLiU',

  'WenQuanYi Zen Hei'
];

const SEC_DEFS = [
  { id: 'browser', title: '浏览器与内核', desc: 'User-Agent、Client Hints、渲染引擎与版本；解析值均标注依据。' },
  { id: 'hardware', title: '系统与硬件', desc: '操作系统、CPU 架构、核心与内存、触控、电池及手柄。' },
  { id: 'screen', title: '屏幕与视口', desc: '屏幕尺寸、DPR、视觉视口、CSS 单位与匹配的媒体查询。' },
  { id: 'locale', title: '语言与时区', desc: 'Intl 区域、时区、夏令时、日期/数字/货币格式。' },
  { id: 'graphics', title: '图形能力', desc: 'WebGL 参数、扩展、着色器精度；WebGPU 适配器信息。' },
  { id: 'hashes', title: '指纹哈希', desc: 'Canvas、音频、WebGL、字体、布局与综合指纹，全部在本机计算。' },
  { id: 'fonts', title: '字体检测', desc: '通过 Canvas 文本宽度差异检测字体是否可用。' },
  { id: 'audio', title: '音频与语音', desc: 'AudioContext 参数、离线渲染与语音合成 voices。' },
  { id: 'media', title: '媒体与编解码', desc: '设备枚举、支持约束与当前浏览器支持的编解码。' },
  { id: 'network', title: '网络', desc: 'Connection API、在线状态、HTTP 协议与公网出口。' },
  { id: 'storage', title: '存储与 Cookie', desc: '本地存储、Cookie、IndexedDB 实测与配额。' },
  { id: 'permissions', title: '权限状态', desc: '浏览器记录的权限状态；未提供该 API 时不显示。' },
  { id: 'features', title: 'API 特性', desc: '仅列出当前浏览器支持的特性，括号内为支持数 / 检测数。' },
  { id: 'css', title: 'CSS 能力', desc: '仅列出当前浏览器支持的 CSS 特性。' },
  { id: 'plugins', title: '插件与 MIME', desc: '浏览器实际返回的插件和 MIME 类型。' },
  { id: 'webrtc', title: 'WebRTC 候选', desc: '未配置 STUN/TURN 时收集到的本地 ICE 候选；无候选时不显示。' },
  { id: 'page', title: '页面与性能', desc: '文档信息、安全上下文与导航时序。' },
  { id: 'privacy', title: '隐私信号', desc: 'DNT、GPC、WebDriver、浏览器对象与 Brave 检测。' }
];

const DEFAULT_OPEN = new Set(['browser', 'hardware', 'screen', 'hashes', 'network']);

const STATE = new Map();
SEC_DEFS.forEach((d) => STATE.set(d.id, { ...d, rows: [], done: false }));

const META = {
  schema: 'browser-fingerprint-report/2',
  generatedAt: null,
  pageUrl: null,
  referrer: null,
  userAgent: null,
  durationMs: null,
  startedAt: 0
};

const SUMMARY = {
  browser: '—', engine: '—', os: '—', device: '—', screen: '—',
  tz: '—', lang: '—', gpu: '—', cpu: '—',
  hashes: { stable: null, composite: null, canvas: null, audio: null, webgl: null, fonts: null, layout: null }
};

const FP = {};
let uaHigh = null;

const UI = {
  status: 'loading',
  open: new Set(DEFAULT_OPEN),
  query: '',
  allDone: false,
  suppressToggle: false
};

async function sha256(input) {
  try {
    const data = typeof input === 'string' ? new TextEncoder().encode(input) : input;
    const digest = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    return '';
  }
}

function plain(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number' && !Number.isFinite(v)) return String(v);
  if (typeof v === 'bigint') return String(v);
  if (ArrayBuffer.isView(v)) return Array.from(v).map(plain);
  if (v instanceof Set) return Array.from(v).map(plain);
  if (Array.isArray(v)) return v.map(plain);
  if (typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v)) o[k] = plain(v[k]);
    return o;
  }
  return v;
}

const SKIP_VALUE_RE = /^(不可用|读取失败|请求失败|查询中|不支持|未检测到|未能|未收集到|未提供|无数据|未知|（空|（未返回）)/;

function clean(v) {
  if (v === undefined || v === null) return undefined;
  if (typeof v === 'string') {
    const s = v.trim();
    if (!s || SKIP_VALUE_RE.test(s)) return undefined;
    return v;
  }
  if (typeof v === 'number') return Number.isFinite(v) ? v : undefined;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'bigint') return String(v);
  if (ArrayBuffer.isView(v)) return clean(Array.from(v));
  if (v instanceof Set) return clean(Array.from(v));
  if (Array.isArray(v)) {
    const a = v.map(clean).filter((x) => x !== undefined);
    return a.length ? a : undefined;
  }
  if (typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v)) {
      const x = clean(v[k]);
      if (x !== undefined) o[k] = x;
    }
    return Object.keys(o).length ? o : undefined;
  }
  return v;
}

function add(secId, label, value, source, opts) {
  const st = STATE.get(secId);
  if (!st) return null;
  const o = opts || {};
  let v;
  let total;
  let supported;
  if (o.type === 'features') {
    const arr = Array.isArray(value) ? value : [];
    const items = arr.filter((x) => x && x.ok === true);
    if (!items.length) return null;
    v = items;
    total = arr.length;
    supported = items.length;
  } else {
    v = clean(value);
    if (v === undefined) return null;
  }
  const row = { label, value: v, source, ...o, total, supported };
  st.rows.push(row);
  scheduleRender();
  return row;
}

let rafId = 0;
function scheduleRender() {
  if (rafId) return;
  rafId = requestAnimationFrame(() => { rafId = 0; render(); });
}

function fmtValue(v, row) {
  if (row && row.type === 'features') {
    const items = Array.isArray(v) ? v : [];
    return `<div class="fgrid">${items.map((it) => `<span class="chip ok" title="${esc(it.expr || it.name)}">${esc(it.name)}</span>`).join('')}</div>`;
  }
  if (ArrayBuffer.isView(v)) v = Array.from(v);
  if (Array.isArray(v)) {
    const simple = v.every((x) => x === null || typeof x !== 'object');
    if (simple) return `<div class="chips">${v.map((x) => `<span class="chip">${esc(x === null ? 'null' : String(x))}</span>`).join('')}</div>`;
    return `<pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`;
  }
  if (v && typeof v === 'object') return `<pre class="json">${esc(JSON.stringify(v, null, 2))}</pre>`;
  const text = String(v);
  const mono = (row && (row.mono || row.copy)) || /^[0-9a-f]{32,}$/i.test(text);
  const long = text.length > 120;
  const copy = row && row.copy ? `<button class="copy" data-copy="${esc(text)}">复制</button>` : '';
  const expand = long ? '<button class="copy" data-expand="1">展开</button>' : '';
  return `<span class="v${mono ? ' mono' : ''}${long ? ' clamp' : ''}">${esc(text)}</span>${expand}${copy}`;
}

function renderRow(r) {
  if (r.type === 'features') {
    const ratio = r.total ? `<span class="ratio">${r.supported}/${r.total}</span>` : '';
    return `<div class="row"><div class="k"><span class="label">${esc(r.label)}</span>${ratio}<span class="src">${esc(r.source)}</span></div><div class="vcell">${fmtValue(r.value, r)}</div></div>`;
  }
  return `<div class="row"><div class="k"><span class="label">${esc(r.label)}</span><span class="src">${esc(r.source)}</span></div><div class="vcell">${fmtValue(r.value, r)}</div></div>`;
}

function totalRows() {
  return SEC_DEFS.reduce((n, d) => n + (STATE.get(d.id).rows.length || 0), 0);
}

function visibleDefs() {
  return SEC_DEFS.filter((d) => STATE.get(d.id).rows.length > 0);
}

function formatDuration(ms) {
  if (ms === null || ms === undefined || !Number.isFinite(ms)) return '—';
  return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(1) + ' s';
}

        <div class="hero-meta">

        <div class="hash-sub">稳定指纹不含浏览器版本，适合设备级比对；综合指纹会随 UA / 引擎升级变化。</div>

function renderStatus() {
  const total = totalRows();
  let mode = UI.status;
  let label = '';
  if (UI.status === 'loading') label = `采集中 · ${total} 项`;
  else if (UI.status === 'partial') label = `核心就绪 · 补充采集中 · ${total} 项`;
  else label = `完成 · ${formatDuration(META.durationMs)} · ${total} 项`;
  const el = $('#status');
  el.className = 'status ' + mode;
  el.title = '每次打开都会重新采集';
  $('#status-text').textContent = label;
  $('#progress').classList.toggle('active', mode === 'loading' || mode === 'partial');
}

function renderNav() {
  const visible = visibleDefs();
  const nav = $('#nav');
  nav.hidden = !visible.length;
  if (!visible.length) return;
  $('#nav-links').innerHTML = visible.map((d) => {
    const n = STATE.get(d.id).rows.length;
    return `<a href="#sec-${d.id}" data-nav="${d.id}"><span>${esc(d.title)}</span><b>${n}</b></a>`;
  }).join('');
}

function renderSections() {
  const host = $('#sections');
  const visible = visibleDefs();
  if (!visible.length) {
    host.innerHTML = UI.allDone
      ? '<div class="empty">当前浏览器没有返回可展示的数据。</div>'
      : '<div class="loading-panel"><div class="skeleton sk-card"></div><p>正在读取浏览器接口…</p></div>';
    return;
  }
  host.innerHTML = visible.map((def) => {
    const st = STATE.get(def.id);
    const open = UI.open.has(def.id) ? ' open' : '';
    const pending = st.done ? '' : '<span class="pending-dot" title="补充采集中"></span>';
    return `<details class="card" id="sec-${def.id}" data-sec="${def.id}"${open}>
      <summary>
        <span class="sum-main"><span class="title">${esc(def.title)}</span><span class="desc">${esc(def.desc)}</span></span>
        <span class="sum-right">${pending}<span class="count">${st.rows.length} 项</span><span class="chev"></span></span>
      </summary>
      <div class="sec-body"><div class="rows">${st.rows.map(renderRow).join('')}</div></div>
    </details>`;
  }).join('');
  bindDetails();
}

function bindDetails() {
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    d.addEventListener('toggle', () => {
      if (UI.suppressToggle || UI.query) return;
      if (d.open) UI.open.add(d.dataset.sec);
      else UI.open.delete(d.dataset.sec);
    });
  });
}

function applyFilter() {
  const input = $('#q');
  const q = (input ? input.value : '').trim().toLowerCase();
  UI.query = q;
  let matches = 0;
  UI.suppressToggle = true;
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    let sectionMatches = 0;
    d.querySelectorAll('.row').forEach((row) => {
      const hit = !q || row.innerText.toLowerCase().includes(q);
      row.hidden = !hit;
      if (hit) sectionMatches++;
    });
    d.hidden = q ? sectionMatches === 0 : false;
    if (q && sectionMatches) d.open = true;
    if (!q) d.open = UI.open.has(d.dataset.sec);
    matches += sectionMatches;
    const nav = document.querySelector('#nav-links a[data-nav="' + d.dataset.sec + '"]');
    if (nav) nav.hidden = d.hidden;
  });
  UI.suppressToggle = false;
  const fc = $('#filter-count');
  if (fc) fc.textContent = q ? `${matches} 项匹配` : '';
  const empty = $('#filter-empty');
  if (empty) empty.hidden = !(q && matches === 0);
}

function updateActiveNav() {
  const links = Array.from(document.querySelectorAll('#nav-links a[data-nav]')).filter((a) => !a.hidden);
  if (!links.length) return;
  const y = window.scrollY + 140;
  let active = links[0];
  for (const a of links) {
    const el = document.getElementById('sec-' + a.dataset.nav);
    if (el && el.getBoundingClientRect().top + window.scrollY <= y) active = a;
  }
  links.forEach((a) => a.classList.toggle('active', a === active));
}

function render() {
  renderStatus();
  renderHero();
  renderNav();
  renderSections();
  applyFilter();
  updateActiveNav();
}

function buildReport() {
  return {
    schema: 'browser-fingerprint-report/2',
    meta: {
      version: 2,
      generatedAt: META.generatedAt,
      pageUrl: META.pageUrl,
      referrer: META.referrer,
      userAgent: META.userAgent || navigator.userAgent,
      durationMs: META.durationMs,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
      languages: navigator.languages
    },
    summary: plain(SUMMARY),
    sections: SEC_DEFS.map((def) => {
      const st = STATE.get(def.id);
      return {
        id: def.id,
        title: def.title,
        description: def.desc,
        done: st.done,
        rows: st.rows.map((r) => ({
          label: r.label,
          value: plain(r.value),
          source: r.source,
          type: r.type || 'value',
          total: r.total,
          supported: r.supported,
          copy: r.copy || undefined
        }))
      };
    })
  };
}

function showToast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已复制到剪贴板');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
    ta.remove();
    showToast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本');
  }
}

async function copyAll() {
  await copyText(JSON.stringify(buildReport(), null, 2));
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(buildReport(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g, '-');
  a.href = URL.createObjectURL(blob);
  a.download = `browser-fingerprint-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  showToast('已生成 JSON 文件');
}

function forceRefresh() {
  location.reload();
}

function expandAll() {
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    d.open = true;
    UI.open.add(d.dataset.sec);
  });
}

function collapseAll() {
  document.querySelectorAll('#sections details[data-sec]').forEach((d) => {
    d.open = false;
    UI.open.delete(d.dataset.sec);
  });
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn) {
    if (btn.id === 'btn-copy-all') { copyAll(); return; }
    if (btn.id === 'btn-download') { downloadJSON(); return; }
    if (btn.id === 'btn-reload') { forceRefresh(); return; }
    if (btn.id === 'btn-expand') { expandAll(); return; }
    if (btn.id === 'btn-collapse') { collapseAll(); return; }
    if (btn.dataset.expand !== undefined) {
      const v = btn.previousElementSibling;
      if (v) {
        v.classList.toggle('clamp');
        btn.textContent = v.classList.contains('clamp') ? '展开' : '收起';
      }
      return;
    }
    if (btn.dataset.copy !== undefined) { copyText(btn.dataset.copy); return; }
  }
  const navLink = e.target.closest('#nav-links a[data-nav]');
  if (navLink) {
    e.preventDefault();
    const id = navLink.dataset.nav;
    const d = document.getElementById('sec-' + id);
    if (!d) return;
    d.open = true;
    UI.open.add(id);
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

const searchInput = $('#q');
if (searchInput) searchInput.addEventListener('input', applyFilter);

let scrollRaf = 0;
window.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; updateActiveNav(); });
}, { passive: true });

}

function runSync(name, fn) {

}


function parseBrowserTokens(ua) {
  const list = [];
  const push = (name, version) => { if (version) list.push({ name, version }); };
  let m;
  if ((m = ua.match(/\bEdg(?:A|iOS)?\/([\d.]+)/))) push('Microsoft Edge', m[1]);
  if ((m = ua.match(/\bEdge\/([\d.]+)/))) push('Microsoft Edge (Legacy)', m[1]);
  if ((m = ua.match(/\b(?:OPR|OPiOS)\/([\d.]+)/))) push('Opera', m[1]);
  if ((m = ua.match(/\bSamsungBrowser\/([\d.]+)/))) push('Samsung Internet', m[1]);
  if ((m = ua.match(/\bUCBrowser\/([\d.]+)/))) push('UC Browser', m[1]);
  if ((m = ua.match(/\bQQBrowser\/([\d.]+)/))) push('QQ Browser', m[1]);
  if ((m = ua.match(/\bQuark\/([\d.]+)/))) push('Quark', m[1]);
  if ((m = ua.match(/\bMiuiBrowser\/([\d.]+)/))) push('Miui Browser', m[1]);
  if ((m = ua.match(/\bHuaweiBrowser\/([\d.]+)/))) push('Huawei Browser', m[1]);
  if ((m = ua.match(/\bVivaldi\/([\d.]+)/))) push('Vivaldi', m[1]);
  if ((m = ua.match(/\bBrave\/([\d.]+)/))) push('Brave', m[1]);
  if ((m = ua.match(/\bElectron\/([\d.]+)/))) push('Electron', m[1]);
  if ((m = ua.match(/\bArkWeb\/([\d.]+)/))) push('ArkWeb', m[1]);
  if ((m = ua.match(/\bMicroMessenger\/([\d.]+)/))) push('微信内置浏览器', m[1]);
  if ((m = ua.match(/\bQQ\/([\d.]+)/))) push('QQ 内置浏览器', m[1]);
  if ((m = ua.match(/\bWeibo\/([\d.]+)/))) push('微博内置浏览器', m[1]);
  if ((m = ua.match(/\baweme\/([\d.]+)/i))) push('抖音内置浏览器', m[1]);
  if ((m = ua.match(/\bAlipayClient\/([\d.]+)/))) push('支付宝内置浏览器', m[1]);
  if ((m = ua.match(/\b(?:baidubrowser|baiduboxapp)[\/ ]?([\d.]*)/i))) push('百度', m[1] || '');
  if ((m = ua.match(/\b(?:Firefox|FxiOS)\/([\d.]+)/))) push('Firefox', m[1]);
  if ((m = ua.match(/\b(?:Chrome|CriOS|CrMo)\/([\d.]+)/))) push('Chrome', m[1]);
  else if ((m = ua.match(/\bChromium\/([\d.]+)/))) push('Chromium', m[1]);
  const safariGuard = !/Chrome|Chromium|CriOS|Edg\/|OPR\/|OPiOS|UCBrowser|Quark|SamsungBrowser|MiuiBrowser|HuaweiBrowser|MicroMessenger|QQBrowser|baidubrowser|baiduboxapp/i.test(ua);
  if (safariGuard && (m = ua.match(/\bVersion\/([\d.]+).*Safari\//))) push('Safari', m[1]);
  return list;
}

function pickBrowser(tokens, hints) {
  if (hints && Array.isArray(hints.fullVersionList)) {
    const brands = hints.fullVersionList.filter((b) => !/not[.\s]?a[\/ ]?brand/i.test(b.brand));
    const order = ['Microsoft Edge', 'Opera', 'Brave', 'Google Chrome', 'Chromium'];
    for (const name of order) {
      const b = brands.find((x) => x.brand === name);
      if (b) return `${name === 'Google Chrome' ? 'Chrome' : name} ${b.version}`;
    }
  }
  const priority = ['Microsoft Edge', 'Microsoft Edge (Legacy)', 'Opera', 'Samsung Internet', 'UC Browser', 'QQ Browser', 'Quark', 'Miui Browser', 'Huawei Browser', 'Brave', 'Vivaldi', 'Firefox', 'Chrome', 'Chromium', 'Safari'];
  for (const name of priority) {
    const t = tokens.find((x) => x.name === name);
    if (t) return `${name} ${t.version}`;
  }
  return tokens.length ? `${tokens[0].name} ${tokens[0].version}`.trim() : '未识别';
}

function detectEngine(ua, maxTouch, hints) {
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && maxTouch > 1);
  const appleWebKit = ua.match(/AppleWebKit\/([\d.]+)/);
  const firefox = ua.match(/\bFirefox\/([\d.]+)/);
  const chromiumFull = (hints && hints.uaFullVersion)
    || (hints && Array.isArray(hints.fullVersionList) ? ((hints.fullVersionList.find((b) => b.brand === 'Google Chrome' || b.brand === 'Chromium') || {}).version || null) : null);
  const chromiumUA = ua.match(/\b(?:Chrome|Chromium|CriOS)\/([\d.]+)/);

  if (/Trident\/|MSIE /.test(ua)) {
    const v = ua.match(/Trident\/([\d.]+)/);
    return { name: 'Trident', version: v ? v[1] : '', detail: `Trident ${v ? v[1] : '（版本未知）'}（IE 内核）`, short: `Trident ${v ? v[1] : ''}`.trim(), basis: '解析 · UA 含 Trident/MSIE 标记' };
  }
  if (/\bEdge\//.test(ua) && !/\bEdg\//.test(ua)) {
    const v = ua.match(/\bEdge\/([\d.]+)/);
    return { name: 'EdgeHTML', version: v[1], detail: `EdgeHTML ${v[1]}（旧版 Edge）`, short: `EdgeHTML ${v[1]}`, basis: '解析 · UA 含 Edge/ 标记' };
  }
  if (isIOS) {
    const v = appleWebKit ? appleWebKit[1] : '';
    return { name: 'WebKit', version: v, detail: `WebKit（AppleWebKit ${v || '版本未知'}）`, short: `WebKit ${v}`.trim(), basis: '推断 · iOS/iPadOS 上浏览器受系统限制使用 WebKit（依据平台）' };
  }
  if (firefox) {
    return { name: 'Gecko', version: firefox[1], detail: `Gecko ${firefox[1]}（Firefox 内核）`, short: `Gecko ${firefox[1]}`, basis: '解析 · UA 含 Firefox 与 Gecko 标记' };
  }
  if (chromiumFull || chromiumUA) {
    const v = chromiumFull || chromiumUA[1];
    const reduced = /\.0\.0\.0$/.test(chromiumUA ? chromiumUA[1] : '');
    return {
      name: 'Blink', version: v,
      detail: `Blink（Chromium ${v}）`,
      short: `Blink / Chromium ${v}`,
      basis: chromiumFull ? 'UA-CH 高熵值（精确版本）' : `解析 · UA Chrome token（${reduced ? '版本号被浏览器简化' : '完整版本'}）`
    };
  }
  if (/\bEdg\//.test(ua) || /\bOPR\//.test(ua)) {
    const v = (chromiumUA && chromiumUA[1]) || '';
    return { name: 'Blink', version: v, detail: `Blink（Chromium ${v || '版本未知'}）`, short: `Blink / Chromium ${v}`.trim(), basis: '解析 · UA 品牌标记' };
  }
  if (appleWebKit) {
    const v = appleWebKit[1];
    return { name: 'WebKit', version: v, detail: `WebKit（AppleWebKit ${v}）`, short: `WebKit ${v}`, basis: '解析 · UA 含 AppleWebKit 且无 Chrome/Firefox 标记' };
  }
  return { name: '未知', version: '', detail: '未能从 UA 判定渲染引擎', short: '未知', basis: '解析 · 无匹配令牌' };
}

function parseOS(ua, maxTouch) {
  const touch = (typeof maxTouch === 'number') ? maxTouch : navigator.maxTouchPoints;
  let m;
  if ((m = ua.match(/HarmonyOS[\/ ]?([\d.]+)?/i))) {
    return { display: `HarmonyOS ${m[1] || '（版本未提供）'}`, short: 'HarmonyOS', basis: '解析 · UA 含 HarmonyOS 标记' };
  }
  if (/OpenHarmony/.test(ua)) {
    return { display: 'OpenHarmony', short: 'OpenHarmony', basis: '解析 · UA 含 OpenHarmony 标记' };
  }
  if ((m = ua.match(/Windows NT ([\d.]+)/))) {
    const map = {
      '10.0': 'Windows 10 / 11（UA 均为 NT 10.0，无法区分）',
      '6.3': 'Windows 8.1', '6.2': 'Windows 8', '6.1': 'Windows 7',
      '6.0': 'Windows Vista', '5.1': 'Windows XP'
    };
    return { display: map[m[1]] || `Windows NT ${m[1]}`, short: 'Windows', basis: '解析 · UA 的 Windows NT 版本令牌' };
  }
  if ((m = ua.match(/Android\s?([\d.]+)/))) {
    return { display: `Android ${m[1]}`, short: `Android ${m[1]}`, basis: '解析 · UA 含 Android 版本' };
  }
  if ((m = ua.match(/(?:iPhone|iPad|iPod).*?OS (\d+)[._](\d+)(?:[._](\d+))?/))) {
    const v = [m[1], m[2], m[3]].filter(Boolean).join('.');
    return { display: `iOS / iPadOS ${v}`, short: `iOS ${v}`, basis: '解析 · UA 含 iPhone/iPad OS 版本' };
  }
  if (/Macintosh/.test(ua) && touch > 1) {
    return { display: 'iPadOS（桌面站点模式 UA 伪装为 Macintosh，依据触点数推断）', short: 'iPadOS', basis: '推断 · Macintosh UA + maxTouchPoints > 1' };
  }
  if ((m = ua.match(/Mac OS X (\d+)[._](\d+)(?:[._](\d+))?/))) {
    const v = [m[1], m[2], m[3]].filter(Boolean).join('.');
    return { display: `macOS ${v}`, short: `macOS ${v}`, basis: '解析 · UA 含 Mac OS X 版本' };
  }
  if ((m = ua.match(/CrOS \S+ ([\d.]+)/))) {
    return { display: `ChromeOS ${m[1]}`, short: 'ChromeOS', basis: '解析 · UA 含 CrOS 标记' };
  }
  if (/Ubuntu/.test(ua)) return { display: 'Ubuntu Linux', short: 'Ubuntu', basis: '解析 · UA 含 Ubuntu 标记' };
  if (/Linux/.test(ua)) return { display: 'Linux', short: 'Linux', basis: '解析 · UA 含 Linux 标记' };
  return { display: '未能从 UA 判定', short: '未知', basis: '解析 · 无匹配令牌' };
}

async function collectBrowser() {
  const ua = navigator.userAgent;
  META.userAgent = ua;
  add('browser', 'User-Agent', ua, 'navigator.userAgent');
  add('browser', 'UA 字符串长度', ua.length, '实测');
  add('browser', 'appName', navigator.appName, 'navigator.appName');
  add('browser', 'appVersion', navigator.appVersion, 'navigator.appVersion');
  add('browser', 'appCodeName', navigator.appCodeName, 'navigator.appCodeName');
  add('browser', 'product', navigator.product, 'navigator.product');
  add('browser', 'productSub', navigator.productSub, 'navigator.productSub');
  add('browser', 'vendor', navigator.vendor, 'navigator.vendor');
  add('browser', 'vendorSub', navigator.vendorSub, 'navigator.vendorSub');
  add('browser', 'platform（旧字段）', navigator.platform, 'navigator.platform');
  add('browser', 'pdfViewerEnabled', navigator.pdfViewerEnabled === undefined ? '不可用' : navigator.pdfViewerEnabled, 'navigator.pdfViewerEnabled');
  add('browser', 'webdriver', navigator.webdriver, 'navigator.webdriver');

  const uad = navigator.userAgentData;
  if (!uad) {
    add('browser', 'User-Agent Client Hints', '不可用', 'navigator.userAgentData 不存在');
  } else {
    add('browser', 'UA-CH 品牌（brands）', (uad.brands || []).map((b) => `${b.brand} ${b.version}`), 'navigator.userAgentData.brands');
    add('browser', 'UA-CH mobile', uad.mobile, 'navigator.userAgentData.mobile');
    add('browser', 'UA-CH platform', uad.platform, 'navigator.userAgentData.platform');
    try {
      uaHigh = await uad.getHighEntropyValues([
        'architecture', 'bitness', 'model', 'platformVersion',
        'uaFullVersion', 'fullVersionList', 'wow64', 'formFactors'
      ]);
      add('browser', 'UA-CH fullVersionList', (uaHigh.fullVersionList || []).map((b) => `${b.brand} ${b.version}`), 'getHighEntropyValues(["fullVersionList"])');
      add('browser', 'UA-CH uaFullVersion', uaHigh.uaFullVersion || '不可用', 'getHighEntropyValues(["uaFullVersion"])');
    } catch (e) {
      add('browser', 'UA-CH 高熵值', '读取失败：' + (e.name || 'Error'), 'getHighEntropyValues() 异常');
    }
  }

  const tokens = parseBrowserTokens(ua);
  add('browser', 'UA 中识别到的浏览器/应用', tokens.length ? tokens.map((t) => `${t.name} ${t.version}`.trim()) : ['未识别'], '解析 · userAgent');

  const engine = detectEngine(ua, navigator.maxTouchPoints, uaHigh);
  add('browser', '渲染引擎', engine.detail, engine.basis);
  add('browser', '内核版本', engine.version || '未能单独判定', engine.basis);
  add('browser', '浏览器品牌/版本', pickBrowser(tokens, uaHigh), '综合 UA-CH 与 UA 解析');

  const wv = [];
  if (/;\s*wv\)/.test(ua)) wv.push('UA 含 "; wv)"');
  if (/Android/.test(ua) && /Version\/4\.0/.test(ua)) wv.push('Android + Version/4.0');
  if (/\bwv\b/.test(ua)) wv.push('UA 含 wv 标记');
  if (wv.length) add('browser', 'Android WebView 判定', { likely: true, signals: wv }, '推断 · UA 信号组合');

  const apps = [];
  const appPatterns = [
    ['微信', /MicroMessenger\/([\d.]+)/], ['QQ', /\bQQ\/([\d.]+)/], ['QQ 浏览器', /QQBrowser\/([\d.]+)/],
    ['微博', /Weibo\/([\d.]+)/], ['抖音', /aweme\/([\d.]+)/i], ['支付宝', /AlipayClient\/([\d.]+)/],
    ['百度', /(baidubrowser|baiduboxapp)[\/ ]?([\d.]*)/i], ['UC', /UCBrowser\/([\d.]+)/],
    ['夸克', /Quark\/([\d.]+)/], ['小米浏览器', /MiuiBrowser\/([\d.]+)/], ['华为浏览器', /HuaweiBrowser\/([\d.]+)/],
    ['三星浏览器', /SamsungBrowser\/([\d.]+)/], ['vivo 浏览器', /VivoBrowser\/([\d.]+)/],
    ['OPPO 浏览器', /HeyTapBrowser\/([\d.]+)/], ['搜狗浏览器', /SogouMobileBrowser\/([\d.]+)/],
    ['Electron', /Electron\/([\d.]+)/], ['Cordova', /Cordova/], ['Capacitor', /Capacitor/]
  ];
  for (const [name, re] of appPatterns) {
    const m = ua.match(re);
    if (m) apps.push(name + (m[1] ? ' ' + m[1] : ''));
  }
  if (apps.length) add('browser', '应用内浏览器 / 容器', apps, '解析 · UA 标记匹配');

  SUMMARY.browser = pickBrowser(tokens, uaHigh);
  SUMMARY.engine = engine.short;
}

function collectHardware() {
  const os = parseOS(navigator.userAgent, navigator.maxTouchPoints);
  add('hardware', '操作系统', os.display, os.basis);
  SUMMARY.os = os.short;

  add('hardware', 'navigator.platform', navigator.platform, 'navigator.platform');

    add('hardware', 'CPU 位数', uaHigh.bitness ? uaHigh.bitness + ' 位' : '不可用', 'getHighEntropyValues(["bitness"])');
    add('hardware', 'WOW64', uaHigh.wow64 === undefined ? '不可用' : uaHigh.wow64, 'getHighEntropyValues(["wow64"])');

  }

  add('hardware', 'navigator.hardwareConcurrency', navigator.hardwareConcurrency || '不可用', 'navigator.hardwareConcurrency');
  add('hardware', 'navigator.deviceMemory (GB)', navigator.deviceMemory === undefined ? '不可用（该浏览器未暴露）' : navigator.deviceMemory, 'navigator.deviceMemory');
  add('hardware', 'navigator.maxTouchPoints', navigator.maxTouchPoints, 'navigator.maxTouchPoints');

  const cores = navigator.hardwareConcurrency;
  const memory = navigator.deviceMemory;
  SUMMARY.cpu = [cores ? cores + ' 核' : null, memory ? memory + ' GB' : null].filter(Boolean).join(' / ') || '—';
  add('hardware', '指针与悬停媒体查询', {
    'pointer: coarse': matchMedia('(pointer: coarse)').matches,

  }, 'matchMedia');

  if (navigator.getGamepads) {
    const pads = Array.from(navigator.getGamepads()).filter(Boolean);

      add('hardware', '已连接游戏手柄', pads.map((g) => ({ id: g.id, index: g.index, connected: g.connected, mapping: g.mapping, axes: g.axes.length, buttons: g.buttons.length })), 'navigator.getGamepads()');
    }

  const mobile = uaHigh ? uaHigh.mobile : (uadMobile());

function measureUnit(prop, value) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;left:-10000px;top:0;visibility:hidden;${prop}:${value};`;
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.remove();
  return prop === 'width' ? r.width : r.height;
}

function collectLocale() {
  const ro = Intl.DateTimeFormat().resolvedOptions();
  add('locale', 'navigator.language', navigator.language, 'navigator.language');
  add('locale', 'navigator.languages', navigator.languages, 'navigator.languages');
  add('locale', 'Intl locale', ro.locale, 'Intl.DateTimeFormat().resolvedOptions().locale');
  add('locale', '日历 (calendar)', ro.calendar, 'resolvedOptions().calendar');
  add('locale', '数字系统 (numberingSystem)', ro.numberingSystem, 'resolvedOptions().numberingSystem');
  add('locale', '时区 (timeZone)', ro.timeZone, 'resolvedOptions().timeZone');
  add('locale', '小时周期 (hourCycle)', ro.hourCycle, 'resolvedOptions().hourCycle');

  const now = new Date();
  const jan = new Date(2024, 0, 15, 12, 0, 0);
  const jul = new Date(2024, 6, 15, 12, 0, 0);
  const off = (d) => -d.getTimezoneOffset();
  add('locale', '时区偏移（当前）', `${off(now)} 分钟`, 'Date.getTimezoneOffset()');
  add('locale', '时区偏移（2024-01）', `${off(jan)} 分钟`, 'Date.getTimezoneOffset()');
  add('locale', '时区偏移（2024-07）', `${off(jul)} 分钟`, 'Date.getTimezoneOffset()');
  add('locale', '夏令时差异', off(jan) === off(jul) ? '无差异（可能不实行夏令时）' : `${Math.abs(off(jan) - off(jul))} 分钟`, '两次真实日期的偏移比较');

  try {
    const parts = new Intl.DateTimeFormat(undefined, { timeZoneName: 'long' }).formatToParts(now);
    const tz = parts.find((p) => p.type === 'timeZoneName');
    add('locale', '时区名称（long）', tz ? tz.value : '未返回', 'Intl.DateTimeFormat formatToParts');
  } catch (e) {
    add('locale', '时区名称', '读取失败：' + e.name, 'formatToParts');
  }

  add('locale', '日期格式', now.toLocaleDateString(), 'Date.toLocaleDateString()');
  add('locale', '时间格式', now.toLocaleTimeString(), 'Date.toLocaleTimeString()');
  add('locale', '日期时间格式', now.toLocaleString(), 'Date.toLocaleString()');
  add('locale', 'Date.toString()', now.toString(), 'Date.toString()');
  add('locale', '数字格式 (1234567.891)', (1234567.891).toLocaleString(), 'Number.toLocaleString()');
  add('locale', '0.1 + 0.2 原始值', String(0.1 + 0.2), 'JavaScript 浮点运算');
  add('locale', '货币格式 USD / CNY', [
    (1234.5).toLocaleString(undefined, { style: 'currency', currency: 'USD' }),
    (1234.5).toLocaleString(undefined, { style: 'currency', currency: 'CNY' })
  ], 'Intl.NumberFormat currency');
  add('locale', '百分比格式', (0.1234).toLocaleString(undefined, { style: 'percent' }), 'Intl.NumberFormat percent');

  try {
    const col = new Intl.Collator();
    add('locale', 'Collator 比较 "ä" vs "z"', col.compare('ä', 'z'), 'Intl.Collator.compare');
    add('locale', 'Collator resolvedOptions', col.resolvedOptions(), 'Intl.Collator.resolvedOptions()');
    add('locale', '排序示例 ["b","ä","a","z"]', ['b', 'ä', 'a', 'z'].sort(col.compare), 'Intl.Collator.compare');
  } catch (e) {
    add('locale', 'Collator', '读取失败：' + e.name, 'Intl.Collator');
  }

  try {
    if (typeof Intl.Locale === 'function') {
      const loc = new Intl.Locale(ro.locale);
      if (typeof loc.getWeekInfo === 'function') {
        add('locale', '周信息 (getWeekInfo)', loc.getWeekInfo(), 'Intl.Locale.getWeekInfo()');
      } else {
        add('locale', '周信息 (getWeekInfo)', '不可用（接口未实现）', 'Intl.Locale.getWeekInfo');
      }
    }
  } catch (e) {
    add('locale', '周信息', '读取失败：' + e.name, 'Intl.Locale');
  }

  add('locale', '文档文字方向', getComputedStyle(document.documentElement).direction, 'getComputedStyle(documentElement).direction');

  SUMMARY.tz = ro.timeZone;
  SUMMARY.lang = (navigator.languages || [navigator.language]).join(', ');
}

function tryGL(type) {
  try {
    const c = document.createElement('canvas');
    return c.getContext(type);
  } catch (e) {
    return null;
  }
}

async function collectGraphics() {
  const g2 = tryGL('webgl2');
  const g1 = tryGL('webgl') || tryGL('experimental-webgl');
  const gl = g2 || g1;
  if (!gl) return;
  add('graphics', 'WebGL 上下文', g2 ? 'WebGL2' : 'WebGL1', "canvas.getContext('webgl2' / 'webgl')");
  add('graphics', '使用的上下文', (typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) ? 'WebGL2RenderingContext' : 'WebGLRenderingContext', 'instanceof 检测');

  const maskedVendor = gl.getParameter(gl.VENDOR);
  const maskedRenderer = gl.getParameter(gl.RENDERER);
  add('graphics', 'VENDOR（屏蔽）', maskedVendor, 'gl.getParameter(gl.VENDOR)');
  add('graphics', 'RENDERER（屏蔽）', maskedRenderer, 'gl.getParameter(gl.RENDERER)');
  add('graphics', 'VERSION', gl.getParameter(gl.VERSION), 'gl.getParameter(gl.VERSION)');
  add('graphics', 'SHADING_LANGUAGE_VERSION', gl.getParameter(gl.SHADING_LANGUAGE_VERSION), 'gl.getParameter(gl.SHADING_LANGUAGE_VERSION)');

  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  let unmaskedVendor = null;
  let unmaskedRenderer = null;
  SUMMARY.gpu = maskedRenderer || '—';
  if (dbg) {
    unmaskedVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
    unmaskedRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    SUMMARY.gpu = unmaskedRenderer || maskedRenderer || '—';
    add('graphics', 'UNMASKED_VENDOR_WEBGL', unmaskedVendor, 'WEBGL_debug_renderer_info');
    add('graphics', 'UNMASKED_RENDERER_WEBGL', unmaskedRenderer, 'WEBGL_debug_renderer_info');
  } else {
    add('graphics', 'WEBGL_debug_renderer_info', '不可用（扩展不存在，浏览器已屏蔽真实渲染器）', 'gl.getExtension');
  }

  const attrs = gl.getContextAttributes();
  if (attrs) add('graphics', '上下文属性', attrs, 'gl.getContextAttributes()');

  const paramNames = [
    'MAX_TEXTURE_SIZE', 'MAX_CUBE_MAP_TEXTURE_SIZE', 'MAX_RENDERBUFFER_SIZE', 'MAX_VIEWPORT_DIMS',
    'ALIASED_LINE_WIDTH_RANGE', 'ALIASED_POINT_SIZE_RANGE', 'MAX_VERTEX_ATTRIBS',
    'MAX_VERTEX_UNIFORM_VECTORS', 'MAX_FRAGMENT_UNIFORM_VECTORS', 'MAX_VARYING_VECTORS',
    'MAX_COMBINED_TEXTURE_IMAGE_UNITS', 'MAX_VERTEX_TEXTURE_IMAGE_UNITS', 'MAX_TEXTURE_IMAGE_UNITS',
    'RED_BITS', 'GREEN_BITS', 'BLUE_BITS', 'ALPHA_BITS', 'DEPTH_BITS', 'STENCIL_BITS',
    'SUBPIXEL_BITS', 'SAMPLE_BUFFERS', 'SAMPLES', 'MAX_TEXTURE_MAX_ANISOTROPY_EXT',
    'MAX_3D_TEXTURE_SIZE', 'MAX_ARRAY_TEXTURE_LAYERS', 'MAX_DRAW_BUFFERS', 'MAX_COLOR_ATTACHMENTS',
    'MAX_ELEMENT_INDEX', 'MAX_UNIFORM_BUFFER_BINDINGS', 'MAX_UNIFORM_BLOCK_SIZE',
    'MAX_VERTEX_OUTPUT_COMPONENTS', 'MAX_FRAGMENT_INPUT_COMPONENTS', 'MAX_SAMPLES',
    'MAX_COMBINED_UNIFORM_BLOCKS', 'MAX_VERTEX_UNIFORM_BLOCKS', 'MAX_FRAGMENT_UNIFORM_BLOCKS',
    'MAX_TEXTURE_LOD_BIAS', 'MAX_CLIENT_WAIT_TIMEOUT_WEBGL', 'MAX_TRANSFORM_FEEDBACK_SEPARATE_ATTRIBS',
    'MAX_TRANSFORM_FEEDBACK_SEPARATE_COMPONENTS', 'MAX_TRANSFORM_FEEDBACK_INTERLEAVED_COMPONENTS'
  ];
  const params = {};
  for (const name of paramNames) {
    if (gl[name] === undefined) continue;
    let v;
    try {
      v = gl.getParameter(gl[name]);
    } catch (e) {
      v = '读取失败（' + e.name + '）';
    }
    params[name] = v;
    add('graphics', name, v, `gl.getParameter(gl.${name})`);
  }

  const precisionNames = [['LOW_FLOAT', gl.LOW_FLOAT], ['MEDIUM_FLOAT', gl.MEDIUM_FLOAT], ['HIGH_FLOAT', gl.HIGH_FLOAT]];
  for (const [shaderName, shaderType] of [['VERTEX_SHADER', gl.VERTEX_SHADER], ['FRAGMENT_SHADER', gl.FRAGMENT_SHADER]]) {
    for (const [pName, pType] of precisionNames) {
      try {
        const f = gl.getShaderPrecisionFormat(shaderType, pType);
        if (f) add('graphics', `着色器精度 ${shaderName}.${pName}`, `rangeMin=${f.rangeMin} rangeMax=${f.rangeMax} precision=${f.precision}`, 'gl.getShaderPrecisionFormat');
      } catch (e) { /* 忽略单个精度查询失败 */ }
    }
  }

  let extensions = [];
  try {
    extensions = gl.getSupportedExtensions() || [];
  } catch (e) {
    extensions = [];
  }
  add('graphics', 'WebGL 扩展数量', extensions.length, 'gl.getSupportedExtensions()');
  add('graphics', 'WebGL 扩展列表', extensions, 'gl.getSupportedExtensions()');

  FP.webgl = await sha256(JSON.stringify({
    vendor: unmaskedVendor || maskedVendor,
    renderer: unmaskedRenderer || maskedRenderer,
    version: gl.getParameter(gl.VERSION),
    params: plain(params),
    extensions
  }));
  SUMMARY.hashes.webgl = FP.webgl;
  add('graphics', 'WebGL 参数哈希（SHA-256）', FP.webgl, 'SHA-256(真实参数 JSON)', { copy: true });
}

async function collectWebGPU() {

  let info = adapter.info;
  if (!info && typeof adapter.requestAdapterInfo === 'function') {

  }
  if (info) {
    const out = {};
    for (const k of ['vendor', 'architecture', 'device', 'description']) {

  if (adapter.features && adapter.features.size) {

}

async function audioFingerprint() {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OAC) return null;
  const ctx = new OAC(1, 44100, 44100);
  const osc = ctx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.value = 10000;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -50;
  comp.knee.value = 40;
  comp.ratio.value = 12;
  comp.attack.value = 0;
  comp.release.value = 0.25;
  osc.connect(comp);
  comp.connect(ctx.destination);
  osc.start(0);
  const buf = await ctx.startRendering();
  const data = buf.getChannelData(0);
  let sum = 0;
  for (let i = 4500; i < 5000 && i < data.length; i++) sum += Math.abs(data[i]);
  return {
    sum: sum.toFixed(6),
    hash: await sha256(data.buffer),
    sampleRate: buf.sampleRate,
    length: buf.length
  };
}

function detectFonts() {
  const baselines = ['monospace', 'sans-serif', 'serif'];
  const span = document.createElement('span');
  span.textContent = 'mmmmmmmmmmlli';
  span.style.cssText = 'position:absolute;left:-9999px;top:-9999px;font-size:72px;white-space:nowrap;font-weight:400;font-style:normal;';
  document.body.appendChild(span);
  const measure = (family) => {
    span.style.fontFamily = family;
    return span.getBoundingClientRect().width;
  };
  const base = {};
  for (const b of baselines) base[b] = measure(b);
  const detected = [];
  for (const f of FONT_LIST) {
    for (const b of baselines) {
      const w = measure(`"${f}", ${b}`);
      if (Math.abs(w - base[b]) > 0.1) {
        detected.push(f);
        break;
      }
    }
  }
  span.remove();
  return { detected: Array.from(new Set(detected)), base };
}

function formatBytes(n) {
  if (!Number.isFinite(n)) return String(n);
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  let v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(2)} ${units[i]}`;
}

  }
}

    geoPromise
  ]);
  const isIPv4 = (ip) => /^\d{1,3}(\.\d{1,3}){3}$/.test(ip);
  const v4ip = (v4.status === 'fulfilled' && v4.value && v4.value.ip) ? v4.value.ip : null;
  const v6ip = (v6.status === 'fulfilled' && v6.value && v6.value.ip) ? v6.value.ip : null;

  if (v4ip) {
    add('network', '公网 IPv4', v4ip, 'api.ipify.org');
  } else if (v6ip && isIPv4(v6ip)) {
    add('network', '公网 IPv4', v6ip + '（经 api64 回退获取）', 'api64.ipify.org');
  }
  if (v6ip && !isIPv4(v6ip)) {
    add('network', '公网 IPv6', v6ip, 'api64.ipify.org');
  }
  if (geo.status === 'fulfilled' && geo.value) {
    add('network', '出口归属地 / 运营商', geo.value.data, geo.value.source);
  }
}

function parseCandidate(c) {
  const p = String(c).split(/\s+/);
  return { raw: c, protocol: p[2] || '', address: p[4] || '', port: p[5] || '', type: p[7] || '' };
}

async function collectWebRTC() {
  if (typeof window.RTCPeerConnection !== 'function') return;
  let pc = null;
  try {
    pc = new RTCPeerConnection({ iceServers: [] });
  } catch (e) {
    return;
  }
  const candidates = new Set();
  pc.onicecandidate = (e) => {
    if (e.candidate && e.candidate.candidate) candidates.add(e.candidate.candidate);
  };
  try {
    pc.createDataChannel('fp');
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
  } catch (e) { /* 协商失败则不展示 */ }
  await sleep(1800);
  const raw = Array.from(candidates);
  try { pc.close(); } catch (e) { /* 已关闭 */ }
  if (!raw.length) return;
  add('webrtc', 'ICE 候选地址', raw.map(parseCandidate), 'RTCPeerConnection（未配置 STUN/TURN，1.8 秒窗口）');
}

const PHASE_A_SECTIONS = ['browser', 'hardware', 'screen', 'locale', 'graphics', 'hashes', 'fonts', 'audio', 'page', 'plugins', 'features', 'css'];

async function computeSummaries() {
  if (SUMMARY.hashes.stable) return;
  const stable = {
    canvas: FP.canvas || null,
    audio: FP.audioHash || null,
    webgl: FP.webgl || null,
    layout: FP.layoutHash || null,
    fonts: FP.fontsHash || null,
    screen: [screen.width, screen.height, screen.availWidth, screen.availHeight, screen.colorDepth],
    dpr: Number(devicePixelRatio.toFixed(3)),
    cores: navigator.hardwareConcurrency || null,
    memory: navigator.deviceMemory || null,
    touch: navigator.maxTouchPoints,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    languages: navigator.languages,
    platform: navigator.platform
  };
  const composite = {
    ...stable,
    ua: navigator.userAgent,
    uaFullVersion: uaHigh ? (uaHigh.uaFullVersion || null) : null,
    engine: SUMMARY.engine
  };
  const stableHash = await sha256(JSON.stringify(stable));
  const compositeHash = await sha256(JSON.stringify(composite));
  if (stableHash) SUMMARY.hashes.stable = stableHash;
  if (compositeHash) SUMMARY.hashes.composite = compositeHash;
  if (stableHash) add('hashes', '稳定设备指纹（SHA-256）', stableHash, 'SHA-256（稳定字段）', { copy: true });
  if (compositeHash) add('hashes', '综合指纹（含 UA 版本，SHA-256）', compositeHash, 'SHA-256（稳定字段 + UA / 引擎版本）', { copy: true });
}

async function collectVoices() {
  const ss = window.speechSynthesis;
  if (!ss) return;
  const voices = await new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; resolve(v); };
    const read = () => finish(ss.getVoices() || []);
    const initial = ss.getVoices();
    if (initial && initial.length) { finish(initial); return; }
    const timer = setTimeout(read, 1000);
    try {
      ss.addEventListener('voiceschanged', () => { clearTimeout(timer); read(); }, { once: true });
    } catch (e) {
      clearTimeout(timer);
      read();
    }
  });
  if (!voices.length) return;
  add('audio', '语音合成 voices', voices.map((v) => `${v.name} (${v.lang})${v.localService ? ' · 本地' : ' · 网络'}`), 'speechSynthesis.getVoices()');
}

function markDone(ids) {
  for (const id of ids) {
    const st = STATE.get(id);
    if (st) st.done = true;
  }
}

function markAllDone() {
  for (const def of SEC_DEFS) {
    const st = STATE.get(def.id);
    if (st) st.done = true;
  }
}

async function phaseA() {
  await run('浏览器与内核', collectBrowser);

  runSync('系统与硬件', collectHardware);
  runSync('屏幕与视口', collectScreen);
  runSync('语言与时区', collectLocale);
  runSync('页面与性能', collectPage);
  runSync('插件与 MIME', collectPlugins);
  runSync('API 特性', collectFeatures);
  runSync('CSS 能力', collectCSS);

  await run('WebGL', collectGraphics);
  await Promise.allSettled([
    run('指纹哈希', collectHashes),
    run('音频', collectAudio)
  ]);

  await computeSummaries();
  markDone(PHASE_A_SECTIONS);
  render();
}

async function phaseB() {
  await Promise.allSettled([
    run('WebGPU', collectWebGPU),
    run('电池', collectBattery),
    run('权限', collectPermissions),
    run('存储', collectStorage),
    run('媒体', collectMedia),
    run('网络', collectNetwork),
    run('公网 IP', collectPublicIP),
    run('WebRTC', collectWebRTC),
    run('语音', collectVoices),
    run('隐私', collectPrivacy)
  ]);

  markAllDone();
  UI.allDone = true;
  META.durationMs = Math.round(performance.now() - META.startedAt);
  UI.status = 'done';
  render();
}

async function startFresh() {
  META.startedAt = performance.now();
  META.generatedAt = new Date().toISOString();
  META.pageUrl = location.href;
  META.referrer = document.referrer;
  META.userAgent = navigator.userAgent;
  UI.status = 'loading';
  render();

  await phaseA();
  UI.status = 'partial';
  render();
  phaseB().catch((e) => console.warn('[phaseB]', e));
}

async function boot() {
  META.startedAt = performance.now();
  META.pageUrl = location.href;
  META.referrer = document.referrer;
  META.userAgent = navigator.userAgent;
  SUMMARY.tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  SUMMARY.lang = (navigator.languages || [navigator.language]).join(', ');
  SUMMARY.screen = `${screen.width}×${screen.height} · DPR ${devicePixelRatio}`;

  try {
    Object.keys(localStorage).filter((k) => k.indexOf('bfp:report:') === 0).forEach((k) => localStorage.removeItem(k));
  } catch (e) { /* 清理旧版本缓存失败时忽略 */ }

  UI.status = 'loading';
  render();
  startFresh().catch((e) => console.warn('[startFresh]', e));
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
})();
